# نشر على Render: Dashboard > New > Blueprint > اختر المستودع.
# القرص الدائم يتطلب خطة مدفوعة (starter)؛ بدونه تضيع البيانات عند كل إعادة تشغيل.
services:
  - type: web
    name: tamam-pro
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: erp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
