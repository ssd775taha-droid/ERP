<style>
/* Layout: شريط علوي لحالة الخطة، مسار مراحل جانبي يطابق مراحل النموذج، ومساحة عمل واحدة لكل مرحلة */

.rm{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;max-width:440px;font-size:.82rem}
.rm div{padding:10px 6px;text-align:center;border-radius:6px}
.rm .c{font-weight:700;font-variant-numeric:tabular-nums}
.rm .c.ok{background:var(--ok-soft);color:var(--ok)} .rm .c.warn{background:var(--warn-soft);color:var(--warn)} .rm .c.bad{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--mut)}

.pdf-page{width:794px;height:1123px;background:#fff;color:#16242b;padding:54px 60px 0;font-family:var(--body);font-size:13px;line-height:1.75;overflow:hidden}

.pdf-page h2{font-size:17px;color:#0d5c63;margin:12px 0 8px}

@media (max-width:860px){

async function makePdf(p,onPage,B,title){B=B||blocks(p);title=title||'الخطة الاستراتيجية';
 if(!window.html2canvas||!window.jspdf)throw new Error('lib');
 try{await document.fonts.ready}catch(e){}
 const host=document.createElement('div');host.className='pdf-host';host.lang='ar';document.body.append(host);
 try{
  const pages=[];let body;
  const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
  const nl=t=>esc(t).replace(/\n/g,'<br>');
  const newPage=()=>{const pg=el('div','pdf-page');body=el('div','pdf-body');pg.append(body,el('div','pdf-foot'));host.append(pg);pages.push(pg)};
  const over=()=>body.scrollHeight>body.clientHeight+1;
  /* عند الانتقال لصفحة جديدة تُنقل العناوين الأخيرة معها حتى لا يبقى عنوان يتيم أسفل الصفحة */
  const breakPage=()=>{const old=body,carry=[];while(old.children.length>1&&/^H[23]$/.test(old.lastElementChild.tagName)){carry.unshift(old.lastElementChild);old.lastElementChild.remove()}newPage();carry.forEach(c=>body.append(c))};
  const place=e=>{body.append(e);if(over()&&body.children.length>1){e.remove();breakPage();body.append(e)}};
  const mkTable=b=>el('table',null,`<colgroup>${b.w.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody></tbody>`);
  for(const b of B){
   if(b.k==='cover'){newPage();body.append(el('div','pdf-cover',`<span>${esc(b.a[0])}</span><b>${esc(b.a[1])}</b><i>${esc(b.a[2])}</i><small>${esc(b.a[3])}</small>`));newPage();continue}
   if(b.k==='h2')place(el('h2',null,esc(b.t)));
   else if(b.k==='h3')place(el('h3',null,esc(b.t)));
   else if(b.k==='p')place(el('p',null,nl(b.t)));
   else if(b.k==='q')place(el('p','pdf-q',filled(b.t)?nl(b.t):'—'));
   else if(b.k==='ul')place(el('ul',null,b.a.map(x=>`<li>${esc(x)}</li>`).join('')));
   else if(b.k==='tb'){let t=mkTable(b);place(t);
    for(const r of b.rows){const tr=el('tr',null,r.map(c=>`<td>${nl(c)}</td>`).join(''));t.tBodies[0].append(tr);
     if(over()&&!(t.tBodies[0].rows.length===1&&body.children.length===1)){tr.remove();if(!t.tBodies[0].rows.length)t.remove();breakPage();t=mkTable(b);body.append(t);t.tBodies[0].append(tr)}}}
  }
  pages.forEach((pg,i)=>{const f=pg.lastElementChild;if(i===0){f.style.visibility='hidden';return}
   f.innerHTML=`<span>${esc(p.name||'')} · ${esc(title)} ${esc(p.from)} - ${esc(p.to)}</span><span>الإصدار ${p.version} · ${STATUS[p.status][0]}</span><span>صفحة ${i+1} من ${pages.length}</span>`});
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true}),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
  for(let i=0;i<pages.length;i++){if(onPage)onPage(i+1,pages.length);
   const c=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
   if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H,undefined,'FAST')}
  return pdf.output('blob');
 }finally{host.remove()}
}

 dir:[['تحسين الرؤية والرسالة','قيّم الرؤية والرسالة الحاليتين باختصار، ثم اقترح صياغة محسّنة واحدة لكل منهما (نوع text للحقلين vision و mission). الرؤية 25 كلمة فأقل، والرسالة تجيب عن: ماذا، لمن، كيف، لماذا.'],['تصنيف الأهداف وربطها','صنّف كل هدف استراتيجي بلا محور على أحد محاور بطاقة الأداء المتوازن (نوع persp)، ونبّه في reply إلى أي محور غير مغطى.'],['اقتراح أهداف وأهداف فرعية','اقترح أهدافاً استراتيجية تسد المحاور غير المغطاة أو البدائل غير المترجمة إلى أهداف (نوع goal مع ربطها بمعرّفات بدائل TOWS إن وُجدت)، وأهدافاً فرعية قابلة للقياس للأهداف القليلة التفصيل (نوع sub).']],

 mon:[['صياغة تعليق التقرير','اكتب تعليقاً وتوصيات لتقرير الأداء الدوري موجهاً للإدارة العليا (100 إلى 150 كلمة): قراءة للأداء العام، أبرز الانحرافات وأسبابها المحتملة بوصفها فرضيات، وثلاث توصيات عملية. قدّمه مقترحاً من نوع text للحقل report.'],['تحليل الانحرافات','حلّل حالة الأنشطة ونسب تحقق مؤشراتها، وحدّد الأنشطة المتأخرة أو المنحرفة عن المستهدف، واقترح معالجة تصحيحية لكل منها (نوع fix). إن لم تُسجَّل قيم متحققة فاذكر ذلك.']],
 req:[['اقتراح المتطلبات','اقترح المتطلبات اللازمة لتنفيذ الأنشطة والأهداف المسجلة، متطلبين لكل نوع من الأنواع الخمسة (نوع req) مع المسؤول بالمسمى الوظيفي.']],

 final:[['مراجعة نقدية للخطة','راجع الخطة مراجعة نقدية كمراجع مستقل: الاتساق بين التحليل والأهداف والأنشطة، قابلية القياس، واقعية الطموح مقارنة بالموارد، والثغرات. اذكر أهم خمس ملاحظات مرتبة بالأولوية في reply (حتى 220 كلمة)، ولا تقدّم مقترحات إلا لما يمكن إصلاحه مباشرة.']]};
const RULES=`أنت مستشار تخطيط استراتيجي خبير تعمل داخل منصة لإعداد الخطط الاستراتيجية للشركات في السعودية. تساعد معدّ الخطة في تحليلها وصياغتها ومراجعتها.
القواعد:
- اعتمد على بيانات الخطة المرفقة فقط. لا تختلق حقائق أو أرقاماً عن الشركة أو سوقها. ما تستنتجه من طبيعة القطاع صغه بوصفه فرضية وبيّن في why أنه يحتاج تحققاً.
- لا تقترح تكاليف مالية ولا قيم أساس للمؤشرات، فهذه يدخلها المستخدم من بياناته.
- اكتب بعربية رسمية واضحة وموجزة، بلا رموز تنسيق (لا نجوم ولا عناوين).
- استخدم المعرّفات (id) الواردة في البيانات كما هي عند الربط، ولا تخترع معرّفات.
- لا تكرر ما هو مسجل في الخطة.
أجب بكائن JSON واحد فقط بهذا الشكل: {"reply":"...","proposals":[...]}
reply: ردّك على المستخدم في حدود 150 كلمة ما لم يُطلب غير ذلك.
proposals: مصفوفة من 0 إلى 12 مقترحاً قابلاً للإضافة إلى الخطة. اجعلها فارغة إن كان السؤال استفساراً لا يحتاج إضافة. كل مقترح أحد هذه الأشكال، ومعه دائماً "why" يبرره في جملة:
{"kind":"pestel","f":"pol|eco|soc|tec|env|leg","t":"نص العامل","eff":"فرصة|تهديد"}
{"kind":"swot","q":"S|W|O|T","t":"نص العنصر","w":1-5}
{"kind":"tows","q":"SO|WO|ST|WT","t":"نص البديل"}
{"kind":"text","field":"intro|profile|vision|mission|report","t":"النص الكامل البديل"}
{"kind":"stake","name":"اسم صاحب المصلحة","expect":"ما يتوقعه"}
{"kind":"value","t":"القيمة"}
{"kind":"goal","t":"نص الهدف","persp":"المالي|العملاء|العمليات الداخلية|التعلم والنمو","tows":["id"]}
{"kind":"persp","goalId":"id","persp":"أحد المحاور الأربعة"}
{"kind":"sub","goalId":"id","t":"هدف فرعي"}
{"kind":"act","subId":"id","t":"النشاط","start":"YYYY-MM","end":"YYYY-MM","owner":"مسمى وظيفي","kpi":"المؤشر","unit":"الوحدة","target":رقم}
{"kind":"req","cat":"human|fin|tech|phys|admin","t":"المتطلب","owner":"مسمى وظيفي"}
{"kind":"risk","goalId":"id","t":"المشكلة","prob":"منخفض|متوسط|عالٍ","imp":"منخفض|متوسط|عالٍ","fix":"المعالجة"}
{"kind":"fix","actId":"id","t":"المعالجة التصحيحية"}`;
const str=v=>String(v??'').trim();
const findGoal=id=>cur.goals.find(g=>g.id===id),findSub=id=>cur.goals.flatMap(g=>g.subs).find(s=>s.id===id),findAct=id=>allActs(cur).map(x=>x.a).find(a=>a.id===id);
const TXT={intro:'المقدمة',profile:'النبذة التعريفية',vision:'الرؤية',mission:'الرسالة',report:'تعليق تقرير الأداء'};
/* لكل نوع: وصف للعرض، وتطبيق على الخطة يعيد false إن تعذّر */
const KINDS={
 pestel:{d:o=>[`PESTEL · العوامل ${PEST[o.f]||''}`,`${str(o.t)}\nالأثر: ${o.eff==='تهديد'?'تهديد':'فرصة'}`],a:o=>PEST[o.f]&&str(o.t)&&cur.pestel[o.f].push({t:str(o.t),eff:o.eff==='تهديد'?'تهديد':'فرصة'})},
 swot:{d:o=>[`تحليل SWOT · ${(SW[o.q]||[''])[0]}`,`${str(o.t)}\nالوزن: ${o.w||3}`],a:o=>SW[o.q]&&str(o.t)&&cur.swot[o.q].push({id:uid(),t:str(o.t),w:String(Math.min(5,Math.max(1,Math.round(+o.w)||3)))})},
 tows:{d:o=>[`مصفوفة الدمج · ${(TW[o.q]||[''])[0]}`,str(o.t)],a:o=>TW[o.q]&&str(o.t)&&cur.tows[o.q].push({id:uid(),t:str(o.t)})},
 text:{d:o=>[`${TXT[o.field]||''} · يستبدل النص الحالي`,str(o.t)],a:o=>{if(!TXT[o.field]||!str(o.t))return false;if(o.field==='mission')cur.mission.text=str(o.t);else if(o.field==='report')cur.report.notes=str(o.t);else cur[o.field]=str(o.t);return true}},
 stake:{d:o=>[`أصحاب المصلحة · ${str(o.name)}`,str(o.expect)],a:o=>{if(!str(o.name)||!str(o.expect))return false;const s=cur.stake.find(x=>x.name.trim()===str(o.name));if(s)s.expect=str(o.expect);else cur.stake.push({name:str(o.name),expect:str(o.expect),power:'متوسط'});return true}},
 value:{d:o=>['القيم',str(o.t)],a:o=>str(o.t)&&cur.values.push({t:str(o.t)})},
 goal:{d:o=>[`هدف استراتيجي${PERSP.includes(o.persp)?' · '+o.persp:''}`,str(o.t)],a:o=>{if(!str(o.t))return false;const ids=Object.keys(TW).flatMap(k=>cur.tows[k].map(i=>i.id));cur.goals.push({id:uid(),t:str(o.t),persp:PERSP.includes(o.persp)?o.persp:'',tows:(Array.isArray(o.tows)?o.tows:[]).filter(i=>ids.includes(i)),subs:[],risks:[]});return true}},
 persp:{d:o=>[`تصنيف هدف · ${(findGoal(o.goalId)||{}).t||'هدف غير موجود'}`,`المحور: ${str(o.persp)}`],a:o=>{const g=findGoal(o.goalId);if(!g||!PERSP.includes(o.persp))return false;g.persp=o.persp;return true}},
 sub:{d:o=>[`هدف فرعي · ${(findGoal(o.goalId)||{}).t||'هدف غير موجود'}`,str(o.t)],a:o=>{const g=findGoal(o.goalId);return !!g&&!!str(o.t)&&g.subs.push({id:uid(),t:str(o.t),acts:[]})}},
 act:{d:o=>[`نشاط · ${(findSub(o.subId)||{}).t||'هدف فرعي غير موجود'}`,`${str(o.t)}\nالمؤشر: ${str(o.kpi)||'—'}${num(o.target)!==null?' · المستهدف: '+o.target+' '+str(o.unit):''}\n${str(o.start)} إلى ${str(o.end)} · ${str(o.owner)}`],a:o=>{const s=findSub(o.subId);if(!s||!str(o.t))return false;const m=v=>/^\d{4}-\d{2}$/.test(str(v))?str(v):'';s.acts.push(Object.assign(TPL.act(),{t:str(o.t),start:m(o.start),end:m(o.end),owner:str(o.owner),kpi:str(o.kpi),unit:str(o.unit),target:num(o.target)!==null?String(num(o.target)):''}));return true}},
 req:{d:o=>[REQ[o.cat]||'متطلب',`${str(o.t)}${str(o.owner)?'\nالمسؤول: '+str(o.owner):''}`],a:o=>REQ[o.cat]&&str(o.t)&&cur.reqs[o.cat].push({t:str(o.t),goal:'',owner:str(o.owner)})},
 risk:{d:o=>[`مشكلة متوقعة · ${(findGoal(o.goalId)||{}).t||'هدف غير موجود'}`,`${str(o.t)}\nالاحتمال: ${str(o.prob)} · الأثر: ${str(o.imp)}\nالمعالجة: ${str(o.fix)}`],a:o=>{const g=findGoal(o.goalId);if(!g||!str(o.t))return false;const l=v=>LVL.includes(v)?v:'متوسط';g.risks.push({t:str(o.t),prob:l(o.prob),imp:l(o.imp),fix:str(o.fix)});return true}},
 fix:{d:o=>[`معالجة تصحيحية · ${(findAct(o.actId)||{}).t||'نشاط غير موجود'}`,str(o.t)],a:o=>{const a=findAct(o.actId);if(!a||!str(o.t))return false;a.fix=str(o.t);return true}}};
function ctx(){const p=cur;return {company:p.name,sector:p.sector,period:[p.from,p.to],status:STATUS[p.status][0],intro:p.intro,profile:p.profile,resources:p.res,team:p.team,stakeholders:p.stake,pestel:Object.fromEntries(Object.keys(PEST).map(k=>[k,p.pestel[k].filter(i=>filled(i.t))])),
 swot:Object.fromEntries(['S','W','O','T'].map(k=>[k,p.swot[k].filter(i=>filled(i.t)).map(i=>({t:i.t,w:+i.w}))])),
 tows:Object.keys(TW).flatMap(k=>p.tows[k].filter(i=>filled(i.t)).map(i=>({id:i.id,q:k,t:i.t}))),
 vision:p.vision,mission:p.mission.text,values:p.values.map(v=>v.t),
 goals:p.goals.map(g=>({id:g.id,t:g.t,persp:g.persp,tows:g.tows,risks:g.risks,subs:g.subs.map(s=>({id:s.id,t:s.t,acts:s.acts.map(a=>({id:a.id,t:a.t,start:a.start,end:a.end,owner:a.owner,cost:a.cost,kpi:a.kpi,unit:a.unit,base:a.base,target:a.target,actual:a.actual,readings:a.reads,progress:progress(a),expectedByTime:expected(a),behindSchedule:behind(a),status:a.status,fix:a.fix}))}))})),
 requirements:p.reqs,unmetQualityChecks:audit(p).filter(r=>!r.ok).map(r=>r.t)}}
function aiShow(v){aiOpen=v&&!!ai&&!!cur;aiEl.hidden=!aiOpen;if(aiOpen){aiDraw();aiIn.focus()}}
function aiDraw(){if(!aiOpen||!cur)return;const locked=cur.status==='approved';
 aiTasksEl.innerHTML=(TASKS[stage]||[]).map((t,i)=>`<button type="button" data-task="${i}"${aiBusy?' disabled':''}>${t[0]}</button>`).join('');
 aiSend.textContent=aiBusy?'إيقاف':'إرسال';
 aiLogEl.innerHTML=(aiTurns.length?'':`<div class="empty">أنا مطّلع على بيانات هذه الخطة كاملة. اختر مهمة من مهام المرحلة الحالية في الأسفل، أو اكتب طلبك. مقترحاتي مسودات تراجعها ثم تضيف منها ما تراه، ولا أعدّل الخطة من تلقاء نفسي.</div>`)
 +aiTurns.map((t,ti)=>t.role==='user'?`<div class="msg u">${esc(t.text)}</div>`:`<div class="msg a${t.err?' err':''}"><p>${esc(t.text)}</p>${(t.props||[]).map((o,pi)=>{const d=KINDS[o.kind].d(o),no=locked&&o.kind!=='fix';return `<div class="prop${o.done?' done':''}"><b>${esc(d[0])}</b><p>${esc(d[1])}</p>${str(o.why)?`<small>${esc(o.why)}</small>`:''}<button type="button" class="btn sm" data-apply="${ti}:${pi}"${o.done||no?' disabled':''}>${o.done?'أُضيف للخطة':no?'الخطة معتمدة ومقفلة':'إضافة للخطة'}</button></div>`}).join('')}${(t.props||[]).filter(o=>!o.done).length>1&&!locked?`<button type="button" class="btn sm pri" data-applyall="${ti}" style="align-self:flex-start">إضافة كل المقترحات</button>`:''}</div>`).join('')
 +(aiBusy?'<div class="think"><i></i><span>يحلّل الوكيل بيانات الخطة. قد يستغرق ذلك حتى دقيقة.</span></div>':'');
 aiLogEl.scrollTop=aiLogEl.scrollHeight}
const AIERR={rate_limited:'بلغتَ حد الاستخدام حالياً. حاول مرة أخرى لاحقاً.',session_expired:'انتهت الجلسة. سجّل الدخول من جديد ثم أعد المحاولة.',refused:'تعذّر تنفيذ هذا الطلب بصيغته الحالية. أعد صياغته.',prompt_too_large:'بيانات الخطة أكبر من أن تُرسل دفعة واحدة. اطلب مهمة أضيق.',empty_completion:'لم يصل رد. بسّط الطلب وأعد المحاولة.'};
async function ask(msg,label){if(aiBusy||!cur||!ai||!str(msg))return;
 const hist=aiTurns.filter(t=>!t.err).slice(-8).map(t=>({role:t.role,content:t.role==='user'?(t.full||t.text):t.text+(t.props&&t.props.length?`\n[قدّمتُ ${t.props.length} مقترحاً]`:'')}));
 aiTurns.push({role:'user',text:label||msg,full:msg});aiBusy=true;aiCtl=new AbortController();aiDraw();
 const input=[{role:'user',content:`${RULES}\n\nالمرحلة المفتوحة أمام المستخدم الآن: ${(STAGES.find(s=>s.k===stage)||{t:'لوحة القيادة'}).t}\n\nبيانات الخطة الحالية (JSON):\n${JSON.stringify(ctx())}`},...hist,{role:'user',content:msg}];
 try{const r=await ai.json(input,{cache:false,signal:aiCtl.signal});const props=(r&&Array.isArray(r.proposals)?r.proposals:[]).filter(o=>o&&typeof o==='object'&&KINDS[o.kind]).slice(0,12);
  aiTurns.push({role:'assistant',text:str(r&&r.reply)||(props.length?'هذه مقترحاتي للمراجعة:':'لم أجد ما أضيفه.'),props})}
 catch(e){const c=e&&e.code;
  if(c==='cancelled')aiTurns.push({role:'assistant',err:1,text:'أُوقف الطلب.'});
  else if(c==='invalid_json'&&e.text)aiTurns.push({role:'assistant',text:str(e.text),props:[]});
  else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){aiOff=true;aiBusy=false;aiShow(false);render();toast('الوكيل الذكي غير متاح في هذا العرض.');return}
  else aiTurns.push({role:'assistant',err:1,text:AIERR[c]||'تعذّر الاتصال بالوكيل. أعد المحاولة.'})}
 aiBusy=false;aiCtl=null;aiDraw()}
function applyProps(list){undo=JSON.stringify(cur);let ok=0,bad=0;for(const o of list){if(o.done)continue;if(cur.status==='approved'&&o.kind!=='fix'){bad++;continue}let r=false;try{r=KINDS[o.kind].a(o)}catch(e){}if(r){o.done=true;ok++}else bad++}
 if(ok){touch();render();aiDraw();toast(`أُضيف ${ok} إلى الخطة${bad?`، وتعذّر ${bad}`:''}.`,'تراجع')}else{undo=null;toast('تعذّر تطبيق المقترح: العنصر المرتبط به غير موجود في الخطة.')}}
aiEl.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(t.id==='ai-close'){aiShow(false);return}
 if(d.task){const k=TASKS[stage][+d.task];ask(k[1],k[0]);return}
 if(d.apply){const [ti,pi]=d.apply.split(':');applyProps([aiTurns[+ti].props[+pi]]);return}
 if(d.applyall){applyProps(aiTurns[+d.applyall].props)}});
document.getElementById('ai-form').addEventListener('submit',e=>{e.preventDefault();if(aiBusy){if(aiCtl)aiCtl.abort();return}const v=aiIn.value;if(!str(v))return;aiIn.value='';ask(v)});
aiIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!aiBusy){e.preventDefault();document.getElementById('ai-form').requestSubmit()}});
window.addEventListener('beforeunload',()=>{if(dirty&&mode==='local'&&cur){plans[cur.id]=cur;localSave()}});
init();
}
