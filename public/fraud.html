var S={tab:"dash",cases:{},assess:{},ctl:{},loaded:false,db:null,dl:null,q:"",fs:"",cur:null,msg:"",ok:"",as:null,tool:{text:"",thr:"",res:null,rows:[]},hashing:false,assets:null,view:null,dirty:false,fl:{sev:"",type:"",sort:"new"},sample:null,ai:{h:{},busy:false,ctl:null,err:''}};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function fmtD(s){if(!s)return"";try{return new Date(s+"T00:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return s}}
function num(v){var n=parseFloat(String(v==null?"":v).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/,/g,""));return isFinite(n)?n:0}
function money(n){return (Math.round(n)||0).toLocaleString("en-US")+" ر.س"}
function val(id){var e=$(id);return e?String(e.value||"").trim():""}
function opts(a,v){return a.map(function(x){return '<option'+(x===v?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
function sel(id,label,a,v){return '<label class="f">'+label+'<select id="'+id+'">'+opts(a,v)+'</select></label>'}
function inp(id,label,v,type,extra,cls){return '<label class="f'+(cls?" "+cls:"")+'">'+label+'<input id="'+id+'" type="'+(type||"text")+'" value="'+esc(v)+'" '+(extra||"")+'></label>'}
function note(){return (S.msg?'<div class="msg bad" role="alert">'+esc(S.msg)+'</div>':"")+(S.ok?'<div class="msg ok">'+esc(S.ok)+'</div>':"")}
function flash(ok,m){S.msg=ok?"":m;S.ok=ok?m:"";$("msg").innerHTML=note();if(ok)setTimeout(function(){if(S.ok===m){S.ok="";$("msg").innerHTML=note()}},3500)}
function sevCls(s){return s==="حرجة"?"bad":s==="عالية"?"warn":s==="متوسطة"?"brand":""}
function isOpen(c){return STAT.indexOf(c.status)<3}
function nextNo(){var m=0;Object.keys(S.cases).forEach(function(k){var x=String(S.cases[k].no||"").match(/(\d+)$/);if(x)m=Math.max(m,+x[1])});return "FR-"+String(m+1).padStart(3,"0")}
function daysSince(d){if(!d)return 0;var t=Date.parse(d+"T00:00:00");return isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/86400000)):0}
function taskLate(t){return !t.done&&t.due&&t.due<today()}
function lossSum(c){return (c.losses||[]).reduce(function(s,x){return s+num(x.amount)},0)}
function clientNames(){try{var p=window.parent;if(p&&p.__tpClientNames)return p.__tpClientNames()||[]}catch(e){}return []}
function dlist(){return '<datalist id="cn">'+clientNames().map(function(n){return '<option value="'+esc(n)+'">'}).join("")+'</datalist>'}

/* ---------- التخزين ---------- */
function put(coll,o){o.updated=new Date().toISOString();if(!S.db){flash(false,"قاعدة البيانات غير متاحة في هذا العرض.");return Promise.resolve()}
  return S.db.collection(coll).doc(o.id).set(o).catch(function(e){flash(false,e&&e.code==="invalid_argument"?"لم يُحفظ: لا تملك صلاحية الكتابة.":"تعذّر الحفظ. تحقق من الاتصال ثم أعد المحاولة.")})}
function del(coll,id){if(!S.db)return;return S.db.collection(coll).doc(id).delete().catch(function(){flash(false,"تعذّر الحذف.")})}
function putCtl(){if(!S.db)return;S.db.doc("ctl/main").set(JSON.parse(JSON.stringify(S.ctl))).catch(function(){flash(false,"تعذّر حفظ حالة الضوابط.")})}
function busyTyping(){if(S.view||(S.ai&&S.ai.busy))return true;var a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("view").contains(a)}

/* ---------- الواجهة ---------- */
function render(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(S.tab===t[0]?" on":"")+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
  $("msg").innerHTML=note();
  var v=!S.loaded?'<div class="empty">جارٍ التحميل…</div>':S.tab==="dash"?vDash():S.tab==="cases"?vCases():S.tab==="assess"?vAssess():S.tab==="tools"?vTools():vCtl();
  $("view").innerHTML=dlist()+v;
  if(S.tab==="assess"&&S.as)liveScore();
}
function cases(){return Object.keys(S.cases).map(function(k){return S.cases[k]}).sort(function(a,b){return String(b.created||"").localeCompare(String(a.created||""))})}
function ctlStats(){var tot=0,ok=0,part=0,na=0;CTL.forEach(function(g){g[1].forEach(function(c){var s=(S.ctl[c[0]]||{}).st||CST[0];if(s===CST[4]){na++;return}tot++;if(s===CST[1])ok++;else if(s===CST[2])part++})});return {tot:tot,ok:ok,part:part,pct:tot?Math.round((ok+part/2)/tot*100):null}}

function vDash(){
  var cs=cases(),op=cs.filter(isOpen),loss=0,rec=0;cs.forEach(function(c){loss+=num(c.amount);rec+=num(c.recovered)});
  var hi=op.filter(function(c){return c.sev==="عالية"||c.sev==="حرجة"}).length,k=ctlStats(),as=Object.keys(S.assess).map(function(x){return S.assess[x]});
  var last=as.sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""))})[0];
  var h='<div class="tiles"><div class="tile"><b>'+op.length+'</b><span>قضية مفتوحة من '+cs.length+'</span></div><div class="tile bad"><b>'+hi+'</b><span>مفتوحة بخطورة عالية أو حرجة</span></div><div class="tile"><b class="num">'+money(loss)+'</b><span>إجمالي الخسائر المقدّرة (المستردّ '+money(rec)+')</span></div><div class="tile"><b>'+(k.pct==null?"—":k.pct+"%")+'</b><span>تغطية ضوابط مكافحة الاحتيال</span></div><div class="tile"><b>'+(last?esc(riskOf(last).lvl):"—")+'</b><span>'+(last?"آخر تقييم: "+esc(last.entity||"")+" ("+fmtD(last.date)+")":"لا تقييمات بعد")+'</span></div></div>';
  h+='<div class="card"><h2>أحدث القضايا</h2>'+(cs.length?'<div class="list">'+cs.slice(0,6).map(caseRow).join("")+'</div>':'<div class="empty"><b>لا قضايا بعد</b>سجّل أول قضية أو بلاغ من تبويب «القضايا».</div>')+'<div class="row"><button class="btn sm" data-act="newcase">قضية جديدة</button><button class="btn sm line" data-act="tab" data-t="tools">افتح الفحوص الجنائية</button><button class="btn sm line" data-act="tab" data-t="assess">قيّم مخاطر الاحتيال</button></div></div>';
  var byT={};cs.forEach(function(c){byT[c.type]=(byT[c.type]||0)+1});
  if(cs.length)h+='<div class="card"><h2>القضايا حسب النوع</h2><div class="bars">'+Object.keys(byT).sort(function(a,b){return byT[b]-byT[a]}).map(function(t){return '<div class="br" style="grid-template-columns:150px 1fr 40px"><span>'+esc(t)+'</span><div class="tr"><i style="width:'+Math.round(byT[t]/cs.length*100)+'%"></i></div><b class="num">'+byT[t]+'</b></div>'}).join("")+'</div></div>';
  if(cs.length){
    var byS={};cs.forEach(function(c){byS[c.status]=(byS[c.status]||0)+1});
    h+='<div class="card"><h2>القضايا حسب الحالة</h2><div class="bars">'+STAT.filter(function(x){return byS[x]}).map(function(t){return '<div class="br" style="grid-template-columns:150px 1fr 40px"><span>'+esc(t)+'</span><div class="tr"><i style="width:'+Math.round(byS[t]/cs.length*100)+'%"></i></div><b class="num">'+byS[t]+'</b></div>'}).join("")+'</div></div>';
    var old=op.slice().sort(function(a,b){return String(a.created||"").localeCompare(String(b.created||""))}).slice(0,5);
    if(old.length)h+='<div class="card"><h2>أقدم القضايا المفتوحة</h2><div class="list">'+old.map(caseRow).join("")+'</div></div>';
    var late=[];cs.forEach(function(c){if(isOpen(c))(c.tasks||[]).forEach(function(t){if(taskLate(t))late.push({c:c,t:t})})});
    late.sort(function(a,b){return String(a.t.due).localeCompare(String(b.t.due))});
    if(late.length)h+='<div class="card"><h2>مهام تحقيق متأخرة ('+late.length+')</h2><div class="list">'+late.slice(0,8).map(function(x){return '<button class="item" data-act="open" data-id="'+esc(x.c.id)+'"><span class="t"><b>'+esc(x.t.text)+'</b><small>'+esc(x.c.no)+" · "+esc(x.c.title)+(x.t.owner?" · "+esc(x.t.owner):"")+'</small></span><span class="chip bad">'+esc(fmtD(x.t.due))+'</span></button>'}).join("")+'</div></div>';
  }
  return h;
}

function vCases(){
  if(S.cur){var c=S.cur==="new"?{id:"",status:STAT[0],sev:SEV[1],type:TYPES[0],found:today(),evidence:[],timeline:[],tasks:[],losses:[],parties:[]}:S.cases[S.cur];if(c)return vCase(c);S.cur=null}

   '<div class="grid">'+inp("e-desc","وصف الدليل","","text","","w2")+sel("e-type","النوع",EVT,EVT[0])+inp("e-src","المصدر أو مكان الحفظ","")+inp("e-by","جمعه","")+inp("e-date","تاريخ الجمع",today(),"date")+'<label class="f">ملف مرفق (اختياري): تُحسب بصمته'+(S.assets?" ويُحفظ للعرض":"")+'<input id="e-file" type="file"></label>'+(S.assets?'<label class="ck f" style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="e-store" checked style="width:auto;min-height:0"> احفظ نسخة من الملف لعرضها لاحقاً</label>':"")+'</div><div class="row"><button class="btn sm" data-act="addev"'+(S.hashing?" disabled":"")+'>'+(S.hashing?"جارٍ حساب البصمة…":"أضف الدليل")+'</button></div>'+

function mdLite(t){
