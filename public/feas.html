<title>تمام برو لدراسات الجدوى</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
/* تخطيط: شريط علوي ثابت + عمود أبواب جانبي + مساحة عمل؛ الأرقام بخط جدولي والتقرير بورق مستقل */
:root{

  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

<script>
/* ===== المحرك المالي: قوائم مترابطة ومؤشرات مصحّحة ===== */
const FS = (function () {
  /* قراءة الأرقام: تقبل الأرقام العربية والفارسية والفواصل، وتعيد null للنص غير الرقمي */
  const parseNum = v => {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let t = String(v == null ? '' : v).trim(); if (t === '') return 0;
    t = t.replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x6F0).replace(/\u066B/g, '.').replace(/[\u066C,\s\u00A0]/g, '').replace(/^\u2212/, '-');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
    const n = parseFloat(t); return isFinite(n) ? n : null;
  };
  const num = v => { const n = parseNum(v); return n == null ? 0 : n; };
  const sum = (a, f) => (a || []).reduce((s, x) => s + (f ? f(x) : x), 0);
  const qp = r => num(r.q) * num(r.p);

  /* معدل العائد الداخلي: مسح شبكي لإيجاد كل تغيّر في الإشارة ثم تنصيف، ويُختار أصغر جذر موجب، وإن لم يوجد فأقرب جذر سالب إلى الصفر */
  function irr(flows) {
    if (!flows.some(c => c > 0) || !flows.some(c => c < 0)) return null;
    const f = r => flows.reduce((s, c, i) => s + c / Math.pow(1 + r, i), 0);
    const grid = []; for (let r = -0.9; r < 1; r += 0.01) grid.push(r); for (let r = 1; r <= 20; r += 0.25) grid.push(r);
    let best = null, pv = f(grid[0]);
    for (let g = 1; g < grid.length; g++) {
      const cv = f(grid[g]);
      if (isFinite(pv) && isFinite(cv) && pv * cv <= 0) { const pos = grid[g] > 1e-9; if (pos) { best = [grid[g - 1], grid[g]]; break; } best = [grid[g - 1], grid[g]]; }
      pv = cv;
    }
    if (!best) return null;
    let lo = best[0], hi = best[1], flo = f(lo);
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) hi = mid; else { lo = mid; flo = fm; } }
    return (lo + hi) / 2;
  }
  const npv = (rate, flows) => flows.reduce((s, c, i) => s + c / Math.pow(1 + rate, i), 0);

  /* فترة الاسترداد بالأشهر: flows[0] سالب (الاستثمار) */
  function payback(flows) {
    let cum = flows[0];
    for (let i = 1; i < flows.length; i++) {
      const prev = cum; cum += flows[i];
      if (cum >= 0) return flows[i] > 0 ? Math.ceil(((i - 1) + (-prev) / flows[i]) * 12 - 1e-9) : i * 12;
    }
    return null;
  }

  /* مصادر التمويل: القرض الرئيسي ثم أي مصادر إضافية، ويُقصّ الإجمالي عند إجمالي الاستثمار */
  function finSources(s, investment) {
    const f = s.fin || {}; let left = Math.max(0, investment);
    /* أصول مشتراة بالتقسيط: الجزء المموّل من البائع يُعامل كتمويل يُسدَّد على أقساط، ويُخصم أولاً من حاجة التمويل الذاتي */
    const inst = (s.assets || []).map(g => ({ name: 'أقساط: ' + (g.name || 'أصل'), amt: sum(g.items, qp) * Math.min(100, Math.max(0, num(g.ip))) / 100, rate: num(g.ir), grace: num(g.ig), term: Math.max(1, num(g.it) || 1), method: 'annuity' })).filter(x => x.amt > 0);
    const raw = inst.concat([{ name: f.name || 'القرض الرئيسي', amt: num(f.loan), rate: num(f.rate), grace: num(f.grace), term: num(f.term), method: f.method, main: true }], (Array.isArray(f.more) ? f.more : []).map(m => ({ name: m.n || 'مصدر تمويل', amt: num(m.amt), rate: num(m.rate), grace: num(m.grace), term: num(m.term), method: m.method })));
    /* عند تحديد مبلغ التمويل الذاتي يصبح القرض الرئيسي هو الباقي من الاستثمار بعد التمويل الذاتي والأقساط والمصادر الأخرى */
    if (f.eqOn) { const others = raw.reduce((a, x, i) => a + (i === inst.length ? 0 : x.amt), 0); raw[inst.length].amt = Math.max(0, investment - Math.max(0, num(f.eq)) - others); }
    /* دون تحديد تمويل ذاتي، مبلغ القرض الرئيسي كما كُتب تماماً بلا أي قصّ على إجمالي الاستثمار */
    return raw.filter(x => x.amt > 0).map(x => { const a = (x.main && !f.eqOn) ? x.amt : Math.min(x.amt, left); left -= a; return Object.assign({}, x, { req: x.amt, amt: a }); }).filter(x => x.amt > 0);
  }
  /* الملخصات الأساسية للمدخلات (سنة الأساس) */
  function base(s) {
    const preop = sum(s.preop, qp);
    const groups = (s.assets || []).map(g => ({ name: g.name, dep: num(g.dep), cost: sum(g.items, qp), count: sum(g.items, r => num(r.q)) }));
    const fixed = sum(groups, g => g.cost);
    const materials = sum(s.materials, qp) * 12;
    const dstaff = sum(s.dstaff, r => num(r.c) * num(r.s)) * 12;
    const dexpCats = {};
    (s.dexp || []).forEach(r => { const k = (r.g || 'مصروفات تشغيلية أخرى').trim(); dexpCats[k] = (dexpCats[k] || 0) + num(r.m) * 12; });
    const dexp = sum(Object.values(dexpCats));
    const direct = materials + dstaff + dexp;
    const rent = num(s.rentMonthly) * 12;
    const astaff = sum(s.astaff, r => num(r.c) * num(r.s)) * 12;
    const gexp = sum(s.gexp, r => num(r.m)) * 12;
    const ga = rent + astaff + gexp;
    const revenue = sum(s.products, qp) * 12;
    const units = sum(s.products, r => num(r.q)) * 12;
    const months = num(s.assume.wcMonths);
    const reserve = (direct + ga) / 12 * months;
    const capital = fixed + preop;
    const investment = capital + reserve;
    const loan = sum(finSources(s, investment), x => x.amt);
    return { preop, groups, fixed, materials, dstaff, dexpCats, dexp, direct, rent, astaff, gexp, ga, revenue, units, months, reserve, capital, investment, loan, equity: investment - loan };
  }

  /* جدول القرض: فترة سماح (فوائد فقط) ثم أقساط سنوية متساوية */
  function loanSchedule(amount, ratePct, grace, term, N, method) {
    const r = ratePct / 100, rows = []; let bal = amount;
    grace = Math.max(0, Math.round(grace)); term = Math.max(1, Math.round(term));
    const pmt = amount <= 0 ? 0 : (r === 0 ? amount / term : amount * r / (1 - Math.pow(1 + r, -term)));
    for (let t = 1; t <= N; t++) {
      const open = bal; let interest = open * r, principal = 0;
      if (open > 0.005 && t > grace) principal = (t === grace + term) ? open : Math.min(open, method === 'equal' ? amount / term : pmt - interest);
      if (open <= 0.005) { interest = 0; }
      bal = open - principal;
      rows.push({ year: t, open, interest, principal, payment: interest + principal, close: bal });
    }
    return rows;
  }

  /* الإهلاك بالقسط الثابت مع إحلال اختياري عند انتهاء العمر */
  function depSchedule(groups, N, replace) {
    const dep = groups.map(() => Array(N).fill(0)), nbv = groups.map(() => Array(N).fill(0)), capex = Array(N).fill(0);
    groups.forEach((g, gi) => {
      if (g.cost <= 0) return;
      if (g.dep <= 0) { for (let t = 0; t < N; t++) nbv[gi][t] = g.cost; return; }
      const life = Math.ceil(100 / g.dep - 1e-9), annual = g.cost * g.dep / 100;
      for (let start = 0; start < N; start += life) {
        if (start > 0) { if (!replace) break; capex[start] += g.cost; }
        let acc = 0;
        for (let k = 0; k < life && start + k < N; k++) {
          const d = Math.min(annual, g.cost - acc); acc += d;
          dep[gi][start + k] += d; nbv[gi][start + k] = g.cost - acc;
        }
      }
    });
    return { dep, nbv, capex };
  }

  /* ov: معاملات تحليل الحساسية {price, vol, cost, reserve} */
  function run(s, ov) {
    ov = Object.assign({ price: 1, vol: 1, cost: 1 }, ov || {});
    const b = base(s), a = s.assume, N = Math.max(1, Math.min(25, Math.round(num(s.meta.years)) || 10));
    const reserve = ov.reserve != null ? ov.reserve : b.reserve;
    const investment = b.capital + reserve, srcs0 = finSources(s, investment), loanAmt = sum(srcs0, x => x.amt), equity = investment - loanAmt;
    const gR = num(a.revGrowth) / 100, gD = num(a.directGrowth) / 100, gG = num(a.gaGrowth) / 100;
    const disc = num(a.discount) / 100, zk = num(a.zakat) / 100, payout = num(a.payout) / 100;
    /* أصول توسعية مشتراة بالتقسيط: تبدأ أقساطها من سنة الشراء */
    const late = (s.expand || []).map(e => ({ name: 'أقساط: ' + (e.n || 'أصل توسعي') + ' (السنة ' + Math.round(num(e.y)) + ')', t0: Math.max(1, Math.round(num(e.y)) - 1), amt: num(e.c) * Math.min(100, Math.max(0, num(e.ip))) / 100, rate: num(e.ir), grace: 0, term: Math.max(1, num(e.it) || 1), method: 'annuity' })).filter(x => x.amt > 0 && x.t0 < N);

  h('التدفق النقدي للمشروع والقيمة الحالية');

  p('صافي القيمة الحالية = مجموع القيم الحالية للتدفقات مطروحاً منه الاستثمار المبدئي البالغ ' + fmt(R.investment) + ' ' + cur + '.' + (s.assume.terminal ? ' تشمل السنة الأخيرة قيمة متبقية قدرها ' + fmt(Y[R.N - 1].terminal) + ' ' + cur + ' تمثل استرداد رأس المال العامل وصافي القيمة الدفترية للأصول.' : ''));

  yearTable('المؤشرات المالية', [

    }

    ['نوع المنشأة', R.ent === 'tax' ? 'ضريبية (ملكية أجنبية كاملة)' : R.ent === 'mixed' ? 'مختلطة: ' + pct(R.zShare, 0) + ' سعودي وخليجي / ' + pct(R.tShare, 0) + ' أجنبي' : 'زكوية (ملكية سعودية وخليجية كاملة)']].concat(R.zShare > 0 ? [['الزكاة', A.zakat + '% ' + (A.zakatMethod === 'base' ? 'من الوعاء الزكوي المبسّط' : 'من صافي الربح') + (R.ent === 'mixed' ? '، على حصة الملاك السعوديين والخليجيين' : '')]] : []).concat(R.tShare > 0 ? [['ضريبة الدخل', A.taxRate + '% من الربح الخاضع' + (R.ent === 'mixed' ? '، على حصة الملاك الأجانب' : '')], ['ترحيل الخسائر الضريبية', A.lossCF === false ? 'غير مفعّل' : 'بلا مدة، بحد ' + A.lossCap + '% من ربح السنة']] : []).concat([['توزيعات الأرباح', A.payout + '% من صافي الربح'],
