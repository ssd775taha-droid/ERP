<style>

*,*::before,*::after{box-sizing:border-box}

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var TABS=[["day","يومي"],["tasks","المهام"],["proj","المشاريع"],["team","الفريق"],["rep","التقارير"]];
var ST=[["todo","للتنفيذ"],["doing","قيد العمل"],["review","للمراجعة"],["blocked","متعثرة"],["done","منجزة"]];
var PR=[["high","عالية","bad"],["med","متوسطة","warn"],["low","منخفضة","good"]];

var COLORS=["#0D6B56","#1F5FA8","#8F6714","#AE2E25","#6B3FA0","#C2570C","#0F766E","#475569"];

    put("tasks",t).then(function(){flash(true,"حُفظت المهمة.")});return render()}

  if(a==="aisplit"&&tk)return aiSplit(tk);
  if(a==="aiaccept"&&tk&&S.ai.split){tk.checklist=tk.checklist||[];S.ai.split.forEach(function(x){tk.checklist.push({id:uid(),text:x,done:false})});S.ai.split=null;logT(tk,"أضاف خطوات مقترحة");put("tasks",tk);return render()}
  if(a==="aiclear"){S.ai.split=null;return renderDrawer()}
  if(a==="aisum")return aiSummary();
  if(a==="golink"&&tk&&tk.link){var G=hubFn("__tpGo");if(G)G(tk.link.m,tk.link.id);return}
  if(a==="in"){var p=myDoc(today());p.sessions=p.sessions||[];if(openSess(p))return;p.sessions.push({in:new Date().toISOString(),out:"",note:val("innote")});p.status=val("pst")||p.status||"avail";S.presence[p.id]=p;put("presence",p);return render()}
  if(a==="out"){var p2=myDoc(today()),os=openSess(p2);if(!os)return;os.out=new Date().toISOString();var on=val("outnote");if(on)os.note=(os.note?os.note+" ← ":"")+on;S.presence[p2.id]=p2;put("presence",p2);return render()}
  if(a==="saveplan"){var p3=myDoc(today());p3.plan=val("plan");S.presence[p3.id]=p3;put("presence",p3).then(function(){flash(true,"حُفظت خطة اليوم.")});return}
  if(a==="saverep"){var p4=myDoc(today());p4.report={done:val("r-done"),blockers:val("r-block"),tomorrow:val("r-next"),at:new Date().toISOString()};S.presence[p4.id]=p4;put("presence",p4).then(function(){flash(true,"حُفظ تقرير اليوم.")});return render()}
  if(a==="addproj"){var n=val("pj-name");if(!n){flash(false,"اكتب اسم المشروع.");return}var pj={id:uid(),name:n,desc:val("pj-desc"),color:val("pj-col"),created:new Date().toISOString(),by:S.me.key};S.projects[pj.id]=pj;put("projects",pj);return render()}
  if(a==="archproj"){var pa=S.projects[b.dataset.id];if(!pa)return;if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="تأكيد الأرشفة";return}pa.archived=true;put("projects",pa);return render()}
  if(a==="projtasks"){S.fl.proj=b.dataset.id;S.tab="tasks";return render()}
  if(a==="rpprev"){S.rep.from=addDays(S.rep.from||weekStart(today()),-7);return render()}
  if(a==="rpnext"){S.rep.from=addDays(S.rep.from||weekStart(today()),7);return render()}
  if(a==="rprint"||a==="rpdf"||a==="rhtml"){var D=repData(S.rep.from||weekStart(today()));return doOut(a==="rprint"?"print":a==="rpdf"?"pdf":"html",repHTML(D),"التقرير الأسبوعي "+D.from,"التقرير الأسبوعي")}

});
