<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحاسبة العامة</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 Tajawal,sans-serif;background:var(--bg,#F2F5F9);color:var(--ink,#0B2540)}
header{background:#062A4D;color:#EAF1F9;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header a{color:#A9C0DA;text-decoration:none;font-size:13px}
nav{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
nav button{border:0;background:transparent;font:inherit;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:#54677D}
nav button[aria-selected=true]{background:#fff;color:#0B3C6E;font-weight:700}
main{background:#fff;margin:0 20px 24px;padding:20px;border-radius:0 0 10px 10px;min-height:60vh;border:1px solid #D5DEE9}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid #E2E9F2;text-align:right;vertical-align:top}
th{background:#F6F8FB;font-weight:700;font-size:13px}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap}
tfoot td{font-weight:700;background:#F6F8FB}
input,select,button.btn{font:inherit;padding:7px 10px;border:1px solid #D5DEE9;border-radius:8px;background:#fff;color:inherit}
button.btn{background:#0B3C6E;color:#fff;border-color:#0B3C6E;cursor:pointer}
button.btn.alt{background:#fff;color:#0B3C6E}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.msg{padding:8px 12px;border-radius:8px;margin-bottom:12px}
.msg.err{background:#FDECEC;color:#8A1C1C}.msg.ok{background:#E6F4EA;color:#17602E}
.muted{color:#54677D}.tag{font-size:12px;background:#E1EBF5;color:#0B3C6E;border-radius:6px;padding:1px 8px}
.lvl1{padding-right:28px}.lvl2{padding-right:52px}
.bad{color:#8A1C1C;font-weight:700}.good{color:#17602E;font-weight:700}
</style>
</head>
<body>
<header><h1>المحاسبة العامة</h1><a href="/">← الرجوع إلى المنصة</a></header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
<script>
(function () {
  'use strict';
  var TYPES = { asset: 'أصول', liability: 'خصوم', equity: 'حقوق ملكية', revenue: 'إيرادات', expense: 'مصروفات' };
  var TABS = [['accounts', 'دليل الحسابات'], ['entry', 'قيد جديد'], ['journal', 'دفتر اليومية'], ['tb', 'ميزان المراجعة'], ['ledger', 'دفتر الأستاذ']];
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), accounts = [], tab = 'accounts', msg = null, canManage = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(m) { return (m / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function today() { return new Date().toISOString().slice(0, 10); }
  function name(code) { var a = accounts.filter(function (x) { return x.code === code; })[0]; return a ? code + ' · ' + a.name : code; }
  function leaves() { return accounts.filter(function (a) { return !accounts.some(function (b) { return b.parent === a.code; }); }); }
  function acctOptions(list, sel) { return list.map(function (a) { return '<option value="' + esc(a.code) + '"' + (a.code === sel ? ' selected' : '') + '>' + esc(a.code + ' · ' + a.name) + '</option>'; }).join(''); }

  function api(method, url, body) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/login.html'; throw new Error('unauthorized'); }
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'خطأ'); return j; });
      });
  }
  function flash(type, text) { msg = { type: type, text: text }; }
  function banner() { var h = msg ? '<div class="msg ' + msg.type + '">' + esc(msg.text) + '</div>' : ''; msg = null; return h; }
  function fail(e) { flash('err', e.message); render(); }

  function paintTabs() {
    $('tabs').innerHTML = TABS.map(function (t) { return '<button role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + '</button>'; }).join('');
  }
  function go(t) { tab = t; render(); }
  $('tabs').addEventListener('click', function (e) { var t = e.target.getAttribute('data-t'); if (t) go(t); });

  function load() {
    return Promise.all([api('GET', '/api/erp/accounts'), fetch('/api/auth/state', { credentials: 'same-origin' }).then(function (r) { return r.json(); })])
      .then(function (r) { accounts = r[0].accounts; var u = r[1].user; canManage = !!u && /^(owner|partner|manager)$/.test(u.role); });
  }

  /* ---------- دليل الحسابات ---------- */
  function depth(a) { var d = 0, p = a.parent; while (p) { d++; var x = accounts.filter(function (z) { return z.code === p; })[0]; p = x && x.parent; } return d; }
  function vAccounts() {
    if (!accounts.length) {
      view.innerHTML = banner() + '<p>لا يوجد دليل حسابات بعد.</p>' + (canManage ? '<button class="btn" id="seed">إنشاء دليل حسابات افتراضي</button>' : '<p class="muted">يطلب من المالك أو المدير إنشاء الدليل.</p>');
      var s = $('seed'); if (s) s.onclick = function () { api('POST', '/api/erp/accounts/seed').then(function () { return load(); }).then(function () { flash('ok', 'أُنشئ الدليل الافتراضي'); render(); }, fail); };
      return;
    }
    var rows = accounts.map(function (a) {
      return '<tr><td class="n">' + esc(a.code) + '</td><td class="lvl' + Math.min(depth(a), 2) + '">' + esc(a.name) + '</td><td><span class="tag">' + TYPES[a.type] + '</span></td></tr>';
    }).join('');
    var form = canManage ? '<h3>حساب جديد</h3><div class="row"><input id="ac" placeholder="الرمز" size="8"><input id="an" placeholder="اسم الحساب" size="26"><select id="at">' +
      Object.keys(TYPES).map(function (k) { return '<option value="' + k + '">' + TYPES[k] + '</option>'; }).join('') + '</select><select id="ap"><option value="">بلا أب</option>' + acctOptions(accounts) + '</select><button class="btn" id="add">إضافة</button></div>' : '';
    view.innerHTML = banner() + form + '<table><thead><tr><th class="n">الرمز</th><th>الحساب</th><th>النوع</th></tr></thead><tbody>' + rows + '</tbody></table>';
    var b = $('add'); if (b) b.onclick = function () {
      api('POST', '/api/erp/accounts', { code: $('ac').value, name: $('an').value, type: $('at').value, parent: $('ap').value || null })
        .then(function () { return load(); }).then(function () { flash('ok', 'أُضيف الحساب'); render(); }, fail);
    };
  }

  /* ---------- قيد جديد ---------- */
  var draft = null;
  function newDraft() { draft = { date: today(), memo: '', ref: '', lines: [{ account: '', debit: '', credit: '' }, { account: '', debit: '', credit: '' }] }; }
  function sums() {
    var d = 0, c = 0; draft.lines.forEach(function (l) { d += Math.round((Number(l.debit) || 0) * 100); c += Math.round((Number(l.credit) || 0) * 100); }); return { d: d, c: c };
  }
  function vEntry() {
    if (!accounts.length) { view.innerHTML = '<p>أنشئ دليل الحسابات أولاً.</p>'; return; }
    if (!draft) newDraft();
    var ls = leaves();
    var rows = draft.lines.map(function (l, i) {
      return '<tr><td><select data-i="' + i + '" data-f="account"><option value="">— اختر الحساب —</option>' + acctOptions(ls, l.account) + '</select></td>' +
        '<td><input data-i="' + i + '" data-f="debit" type="number" min="0" step="0.01" value="' + esc(l.debit) + '"></td>' +
        '<td><input data-i="' + i + '" data-f="credit" type="number" min="0" step="0.01" value="' + esc(l.credit) + '"></td>' +
        '<td><button class="btn alt" data-rm="' + i + '" ' + (draft.lines.length <= 2 ? 'disabled' : '') + '>×</button></td></tr>';
    }).join('');
    view.innerHTML = banner() + '<div class="row"><input id="ed" type="date" value="' + esc(draft.date) + '"><input id="em" placeholder="البيان" size="34" value="' + esc(draft.memo) + '"><input id="er" placeholder="المرجع (اختياري)" size="16" value="' + esc(draft.ref) + '"></div>' +
      '<table><thead><tr><th>الحساب</th><th class="n">مدين</th><th class="n">دائن</th><th></th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td>الإجمالي</td><td class="n" id="td">0.00</td><td class="n" id="tc">0.00</td><td></td></tr></tfoot></table>' +
      '<div class="row" style="margin-top:12px"><button class="btn alt" id="addl">+ سطر</button><button class="btn" id="post">ترحيل القيد</button><span id="bal"></span></div>';
    function paintSums() {
      var s = sums(); $('td').textContent = money(s.d); $('tc').textContent = money(s.c);
      $('bal').innerHTML = s.d === s.c && s.d > 0 ? '<span class="good">متوازن</span>' : '<span class="bad">الفرق: ' + money(Math.abs(s.d - s.c)) + '</span>';
      $('post').disabled = !(s.d === s.c && s.d > 0);
    }
    paintSums();
    view.oninput = view.onchange = function (e) {
      var t = e.target;
      if (t.id === 'ed') draft.date = t.value; else if (t.id === 'em') draft.memo = t.value; else if (t.id === 'er') draft.ref = t.value;
      else if (t.getAttribute('data-f')) {
        var l = draft.lines[Number(t.getAttribute('data-i'))], f = t.getAttribute('data-f'); l[f] = t.value;
        if (f === 'debit' && t.value) { l.credit = ''; var o = view.querySelector('[data-i="' + t.getAttribute('data-i') + '"][data-f=credit]'); if (o) o.value = ''; }
        if (f === 'credit' && t.value) { l.debit = ''; var p = view.querySelector('[data-i="' + t.getAttribute('data-i') + '"][data-f=debit]'); if (p) p.value = ''; }
      }
      paintSums();
    };
    view.onclick = function (e) {
      var rm = e.target.getAttribute('data-rm');
      if (rm !== null) { draft.lines.splice(Number(rm), 1); return vEntry(); }
      if (e.target.id === 'addl') { draft.lines.push({ account: '', debit: '', credit: '' }); vEntry(); }
      if (e.target.id === 'post') {
        e.target.disabled = true;
        api('POST', '/api/erp/entries', { date: draft.date, memo: draft.memo, ref: draft.ref, lines: draft.lines.filter(function (l) { return l.account; }) })
          .then(function (r) { newDraft(); flash('ok', 'رُحّل القيد رقم ' + r.entry.id); go('journal'); }, function (er) { flash('err', er.message); vEntry(); });
      }
    };
  }

  /* ---------- دفتر اليومية ---------- */
  var jf = { from: '', to: '' };
  function vJournal() {
    var q = '?limit=100' + (jf.from ? '&from=' + jf.from : '') + (jf.to ? '&to=' + jf.to : '');
    api('GET', '/api/erp/entries' + q).then(function (r) {
      var reversed = {}; r.entries.forEach(function (e) { if (e.void_of) reversed[e.void_of] = true; });
      var body = r.entries.map(function (e) {
        var head = '<tr style="background:#F6F8FB"><td class="n"><b>#' + e.id + '</b></td><td colspan="2"><b>' + esc(e.date) + '</b> ' + esc(e.memo) + (e.ref ? ' <span class="muted">(' + esc(e.ref) + ')</span>' : '') + (e.void_of ? ' <span class="tag">عكسي</span>' : '') + (reversed[e.id] ? ' <span class="tag">معكوس</span>' : '') + '</td><td class="n">' +
          (!e.void_of && !reversed[e.id] ? '<button class="btn alt" data-rev="' + e.id + '">عكس</button>' : '') + '</td></tr>';
        return head + e.lines.map(function (l) { return '<tr><td></td><td>' + esc(name(l.account)) + '</td><td class="n">' + (l.debit ? money(l.debit) : '') + '</td><td class="n">' + (l.credit ? money(l.credit) : '') + '</td></tr>'; }).join('');
      }).join('');
      view.innerHTML = banner() + '<div class="row"><label>من <input id="jf" type="date" value="' + jf.from + '"></label><label>إلى <input id="jt" type="date" value="' + jf.to + '"></label><button class="btn" id="jgo">تصفية</button></div>' +
        (r.entries.length ? '<table><thead><tr><th class="n">رقم</th><th>الحساب / البيان</th><th class="n">مدين</th><th class="n">دائن</th></tr></thead><tbody>' + body + '</tbody></table>' : '<p class="muted">لا توجد قيود.</p>');
      $('jgo').onclick = function () { jf.from = $('jf').value; jf.to = $('jt').value; vJournal(); };
      view.onclick = function (e) {
        var id = e.target.getAttribute('data-rev');
        if (id && confirm('سيُنشأ قيد عكسي مقابل للقيد رقم ' + id + '. متابعة؟')) api('POST', '/api/erp/entries/' + id + '/reverse', {}).then(function () { flash('ok', 'عُكس القيد'); vJournal(); }, fail);
      };
    }, fail);
  }

  /* ---------- ميزان المراجعة ---------- */
  var tbTo = '';
  function vTb() {
    api('GET', '/api/erp/trial-balance' + (tbTo ? '?to=' + tbTo : '')).then(function (r) {
      var rows = r.rows.map(function (x) { return '<tr><td class="n">' + esc(x.code) + '</td><td>' + esc(x.name) + '</td><td class="n">' + money(x.debit) + '</td><td class="n">' + money(x.credit) + '</td><td class="n">' + (x.balance_debit ? money(x.balance_debit) : '') + '</td><td class="n">' + (x.balance_credit ? money(x.balance_credit) : '') + '</td></tr>'; }).join('');
      var t = r.totals;
      view.innerHTML = banner() + '<div class="row"><label>حتى تاريخ <input id="tt" type="date" value="' + tbTo + '"></label><button class="btn" id="tgo">عرض</button><span class="' + (r.balanced ? 'good' : 'bad') + '">' + (r.balanced ? 'الميزان متوازن' : 'الميزان غير متوازن') + '</span></div>' +
        (r.rows.length ? '<table><thead><tr><th class="n">الرمز</th><th>الحساب</th><th class="n">مجموع المدين</th><th class="n">مجموع الدائن</th><th class="n">رصيد مدين</th><th class="n">رصيد دائن</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td></td><td>الإجمالي</td><td class="n">' + money(t.debit) + '</td><td class="n">' + money(t.credit) + '</td><td class="n">' + money(t.balance_debit) + '</td><td class="n">' + money(t.balance_credit) + '</td></tr></tfoot></table>' : '<p class="muted">لا توجد حركات.</p>');
      $('tgo').onclick = function () { tbTo = $('tt').value; vTb(); };
      view.onclick = null;
    }, fail);
  }

  /* ---------- دفتر الأستاذ ---------- */
  var lg = { code: '', from: '', to: '' };
  function vLedger() {
    var sel = '<div class="row"><select id="lc"><option value="">— اختر الحساب —</option>' + acctOptions(accounts, lg.code) + '</select><label>من <input id="lf" type="date" value="' + lg.from + '"></label><label>إلى <input id="lt" type="date" value="' + lg.to + '"></label><button class="btn" id="lgo">عرض</button></div>';
    function bind() { $('lgo').onclick = function () { lg.code = $('lc').value; lg.from = $('lf').value; lg.to = $('lt').value; vLedger(); }; view.onclick = null; }
    if (!lg.code) { view.innerHTML = banner() + sel; bind(); return; }
    api('GET', '/api/erp/ledger/' + encodeURIComponent(lg.code) + '?' + (lg.from ? 'from=' + lg.from + '&' : '') + (lg.to ? 'to=' + lg.to : '')).then(function (r) {
      var rows = r.rows.map(function (m) { return '<tr><td>' + esc(m.date) + '</td><td class="n">#' + m.entry_id + '</td><td>' + esc(m.memo) + '</td><td class="n">' + (m.debit ? money(m.debit) : '') + '</td><td class="n">' + (m.credit ? money(m.credit) : '') + '</td><td class="n">' + money(m.balance) + '</td></tr>'; }).join('');
      view.innerHTML = banner() + sel + '<h3>' + esc(r.account.code + ' · ' + r.account.name) + '</h3><table><thead><tr><th>التاريخ</th><th class="n">قيد</th><th>البيان</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">الرصيد</th></tr></thead><tbody><tr><td colspan="5">رصيد أول الفترة</td><td class="n">' + money(r.opening) + '</td></tr>' + rows + '</tbody><tfoot><tr><td colspan="5">الرصيد الختامي</td><td class="n">' + money(r.closing) + '</td></tr></tfoot></table>';
      bind();
    }, fail);
  }

  function render() {
    paintTabs(); view.oninput = view.onchange = view.onclick = null;
    ({ accounts: vAccounts, entry: vEntry, journal: vJournal, tb: vTb, ledger: vLedger })[tab]();
  }
  load().then(render, function (e) { view.textContent = e.message; });
})();
</script>
</body>
</html>
