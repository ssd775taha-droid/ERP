<title>تمام برو للحوكمة</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
/* Layout: a consultant's workbench. One 920px column: client list, then per-client tabs (overview, assessment, gaps, plan, register, documents). */
:root{
  --bg:#F2F5F5;--card:#FFFFFF;--ink:#14212A;--muted:#5A6873;--line:#D4DCE0;
  --acc:#0F4C5C;--acc-ink:#FFFFFF;--acc-soft:#E0EDF0;--acc-h:#0A3A47;
  --bar:#0C3A47;--bar-ink:#F2F7F8;--bar-mut:#A9C3CA;--bar-on:#1A5463;--bar-line:#245E6D;--bar-bad:#FFB4AB;--gold:#E0AE55;

  --ok:#2E7D4F;--ok-bg:#E4F2E9;--warn:#8F5E0F;--warn-bg:#FBF1DC;--bad:#B3261E;--bad-bg:#FBE9E7;
  --head:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161A;--card:#18222A;--ink:#E6ECEF;--muted:#98A6B0;--line:#2B3842;

:root[data-theme="dark"]{
  --bg:#0F161A;--card:#18222A;--ink:#E6ECEF;--muted:#98A6B0;--line:#2B3842;
  --acc:#5FB3C6;--acc-ink:#0B1417;--acc-soft:#16303A;--acc-h:#7CC6D6;
  --bar:#0A1114;--bar-ink:#E6ECEF;--bar-mut:#8FA0AA;--bar-on:#1B2A33;--bar-line:#27363F;--bar-bad:#F08A80;--gold:#E0B25A;

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(120px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.4;margin:0;text-wrap:balance}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px}
i[lang="en"]{font-style:normal;direction:ltr;unicode-bidi:isolate;color:var(--muted);font-size:.88em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:54px}
.brand{font-family:var(--head);font-weight:700;font-size:17px;background:none;border:0;padding:6px 0;display:flex;align-items:center;gap:9px;min-height:44px}
.brand svg{flex:none}
.sp{flex:1}
.sv{font-size:13px;color:var(--muted);white-space:nowrap}
.sv.err{color:var(--bad);font-weight:600}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-block:2px 8px}
.who b{font-family:var(--head);font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14.5px;font-weight:600;min-height:38px;white-space:nowrap}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

main{padding-block:22px 60px}
.h1{font-size:clamp(24px,6vw,32px);font-weight:700}
.lede{color:var(--muted);margin:8px 0 0;max-width:42em}
.sec{margin-top:30px}
.sec>h2{font-size:19px}
.sec>p.sub{color:var(--muted);font-size:14.5px;margin:2px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;font-family:var(--head);font-weight:600;font-size:15px;min-height:44px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;text-decoration:underline}
.chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.7}
.chip.m{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.g{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.p{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.note{background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:14.5px;margin-top:14px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);margin-top:18px}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-size:18px;margin-bottom:4px}

/* tiles + bars */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile b{display:block;font-family:var(--head);font-weight:700;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tile span{font-size:13.5px;color:var(--muted);line-height:1.5;display:block}
.bars{display:grid;gap:12px;margin-top:10px}
.brow .l{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.brow .l b{font-weight:600}
.brow .l span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--acc);border-radius:4px}
.track i.lo{background:var(--bad)}.track i.mid{background:var(--warn)}.track i.hi{background:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flow li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.flow li.nx{border-color:var(--acc);border-width:2px}
.flow .fn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:14px}
.flow li.dn .fn{background:var(--ok);border-color:var(--ok);color:var(--card)}
.flow .t{flex:1;min-width:0}.flow .t b{display:block;font-family:var(--head);font-weight:600;line-height:1.4}.flow .t span{display:block;font-size:13.5px;color:var(--muted);line-height:1.5}
.flow li.dn .t b{color:var(--muted)}
.clia{margin:8px 0 0!important;font-size:14px;font-weight:400!important;background:var(--acc-soft);border-radius:8px;padding:4px 10px;display:inline-block;overflow-wrap:anywhere}
.oc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.oc svg{display:block;max-width:none;margin-inline:auto}
.oc-l{stroke:var(--muted);stroke-width:1.5}
.oc-b{fill:var(--bg);stroke:var(--muted)}.oc-b.g{fill:var(--acc-soft);stroke:var(--acc)}
.oc-t{font-family:var(--head);font-size:12.5px;font-weight:600;text-anchor:middle;fill:var(--ink)}
.oc-h{font-family:var(--body);font-size:11px;text-anchor:middle;fill:var(--muted)}
.asg{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:end;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tree{list-style:none;margin:0;padding:0;padding-inline-start:18px;border-inline-start:2px solid var(--line)}
main>.tree{padding-inline-start:0;border:0;margin-top:14px}
.tree li{margin-top:8px}
.paper .tree{padding-inline-start:20px;margin-top:4px}.paper .tree li{margin-top:4px}
.nd{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px}
.nb{flex:1;min-width:0;text-align:start;background:none;border:0;padding:4px 0;min-height:44px}
.nb b{display:block;font-family:var(--head);font-weight:600;line-height:1.4}
.nb small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.dlt{font-style:normal;font-size:13px;font-weight:600;margin-inline-start:8px;font-family:var(--body)}
.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.heat{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;max-width:420px;direction:ltr;align-items:center;margin-top:8px}
.heat .ax{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center}
.heat .lb{font-size:13px;color:var(--muted);text-align:center;padding-inline:6px;font-variant-numeric:tabular-nums}
.hc{aspect-ratio:1.5;border-radius:6px;display:grid;place-items:center;font-family:var(--head);font-weight:700;opacity:.45}
.hc.has{opacity:1;outline:2px solid var(--ink);outline-offset:-2px}
.hc.h{background:var(--bad-bg);color:var(--bad)}.hc.md{background:var(--warn-bg);color:var(--warn)}.hc.l{background:var(--ok-bg);color:var(--ok)}

/* cards & forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.card.cl{display:flex;gap:14px;align-items:center;width:100%;text-align:start}
.card.cl .t{flex:1;min-width:0}
.card.cl .t b{display:block;font-family:var(--head);font-size:17px}
.card.cl .t span{font-size:14px;color:var(--muted)}
.card.cl .n{font-family:var(--head);font-weight:700;font-size:20px;direction:ltr}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:13.5px;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:3px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-height:42px;color:var(--ink);font-size:15.5px}
label.f>textarea{min-height:64px;resize:vertical;line-height:1.6}
label.ck{display:flex;gap:8px;align-items:center;font-size:15px;min-height:42px}
label.ck input{width:18px;height:18px;accent-color:var(--acc)}

/* assessment */
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:26px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.dh h3{font-size:17px}
.dh span{font-size:14px;color:var(--muted);white-space:nowrap}
.cr{padding:14px 0;border-bottom:1px solid var(--line)}
.cr p{margin:0;font-weight:500}
.cr .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.cr .src{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1 1 0;border:1.5px solid var(--line);background:var(--card);border-radius:8px;min-height:40px;font-size:14px;font-weight:600;padding:2px 8px;white-space:nowrap}
.seg button.on.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button.on.p{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button.on.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg button.on.x{background:var(--line);border-color:var(--muted)}
.cr input.nt{width:100%;margin-top:8px;border:0;border-bottom:1px dashed var(--line);background:none;padding:6px 0;font-size:14.5px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lv button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;min-height:44px;font-family:var(--head);font-weight:600;padding:2px}
.lv button small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.2}
.lv button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.lv button.on small{color:var(--acc-ink)}
.legend{font-size:13.5px;color:var(--muted);margin-top:8px}

.gap{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.gap .t{flex:1;min-width:0}
.gap .t b{display:block;font-weight:600}
.gap .t span{display:block;font-size:14.5px;color:var(--muted)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.item.late{border-color:var(--bad)}
.item .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .hd input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:none;font-family:var(--head);font-weight:600;font-size:16px;padding:4px 0}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;min-width:36px;min-height:36px;border-radius:8px}
.x:hover{color:var(--bad)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px}
.sc{font-family:var(--head);font-weight:700;border-radius:8px;padding:2px 10px;font-size:14px;white-space:nowrap}
.sc.h{background:var(--bad-bg);color:var(--bad)}.sc.md{background:var(--warn-bg);color:var(--warn)}.sc.l{background:var(--ok-bg);color:var(--ok)}
/* documents */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dl button{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:72px}
.dh{font-size:16px;margin:22px 0 0}
.dl button b{display:block;font-family:var(--head)}
.dl button span{font-size:14px;color:var(--muted);line-height:1.5;display:block}
.paper{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px 26px;margin-top:14px;line-height:1.9}
.paper h1{font-size:22px;text-align:center}
.paper .co{text-align:center;color:var(--muted);margin:4px 0 18px}
.paper h2{font-size:17px;margin-top:22px}
.paper p{margin:8px 0 0}
.paper ol,.paper ul{margin:8px 0 0;padding-inline-start:1.4em}
.paper li{margin-top:4px}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
th{font-family:var(--head);font-weight:600;background:var(--bg)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
.sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:14px}

/* ---- v8 skin: dark teal app bar (side rail on wide screens), icon buttons with clear states ---- */
.top{background:var(--bar);color:var(--bar-ink);border-bottom:0;box-shadow:var(--sh2)}
.top :focus-visible{outline-color:var(--gold)}
.brand{color:var(--bar-ink)}.brand svg{color:var(--gold)}
.top .sv{color:var(--bar-mut)}.top .sv.err{color:var(--bar-bad)}
.top .chip{border-color:var(--bar-line);color:var(--bar-mut)}
.who{padding-block:0 8px}.who b{font-size:17px}
.tabs{gap:4px}
main .tab{transition:background .15s,border-color .15s}main .tab:hover{border-color:var(--acc)}
.top .tab{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:var(--bar-mut);border-radius:10px;padding:6px 12px;min-height:40px;transition:background .15s,color .15s}
.top .tab::before{content:"";width:17px;height:17px;flex:none;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.top .tab:hover{background:var(--bar-on);color:var(--bar-ink)}
.top .tab.on{background:var(--bar-on);color:var(--bar-ink);border-color:var(--bar-line)}
.top .tab.on::before{background:var(--gold)}
.top .tab .bd{font-style:normal;font-family:var(--head);font-size:12px;font-weight:700;min-width:21px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--bar);line-height:1.7;text-align:center;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:8px 18px;line-height:1.4;text-align:center;box-shadow:var(--sh);transition:background .15s,border-color .15s,box-shadow .15s,transform .08s}
.btn:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.pri:hover:not(:disabled){background:var(--acc-h);border-color:var(--acc-h)}
.btn.sm{border-radius:10px;gap:6px;padding:4px 13px}
.btn.dng{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.dng:hover:not(:disabled){background:var(--bad-bg);border-color:var(--bad)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn::before,.btn::after{content:"";display:none;width:16px;height:16px;flex:none;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.btn.sm::before,.btn.sm::after{width:14px;height:14px}
.x{border-radius:50%;transition:background .15s,color .15s}.x:hover{background:var(--bad-bg)}
.seg button,.lv button{border-radius:10px;transition:background .15s,border-color .15s}
.seg button:hover,.lv button:hover{border-color:var(--acc)}
.card,.tile,.item,.flow li,.dl button{box-shadow:var(--sh)}
.card,.tile,.item{border-radius:14px}
.card.cl,.dl button{transition:border-color .15s,box-shadow .15s,transform .1s}
.card.cl:hover,.dl button:hover{border-color:var(--acc);box-shadow:var(--sh2);transform:translateY(-1px)}
.flow li.nx{background:var(--acc-soft)}
label.f>input:focus,label.f>select:focus,label.f>textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ring{flex:none;display:grid;justify-items:center;gap:1px}
.ring svg{display:block}
.ring .tr{stroke:var(--line)}.ring .pg{stroke:var(--acc)}.ring .pg.lo{stroke:var(--bad)}.ring .pg.mid{stroke:var(--warn)}.ring .pg.hi{stroke:var(--ok)}
.ring text{font-family:var(--head);font-weight:700;font-size:15px;fill:var(--ink);text-anchor:middle}
.ring small{font-size:11.5px;color:var(--muted);line-height:1.3}
.card.cl .t .ms{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.card.cl .t .ms i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--bg);border-radius:999px;padding:1px 10px;line-height:1.7;font-variant-numeric:tabular-nums}
.card.cl .t .nxs{display:block;margin-top:6px;color:var(--acc);font-weight:600;font-size:13.5px}
.card.cl .go{flex:none;width:18px;height:18px;background:var(--muted);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M14%206l-6%206%206%206%22%2F%3E%3C%2Fsvg%3E")}
.q{display:block;width:100%;margin-top:12px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;min-height:44px;font-size:15.5px}
.q:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.pst{margin-top:10px;font-size:14.5px}.pst summary{cursor:pointer;color:var(--acc);font-weight:600;min-height:32px}
.pst textarea{display:block;width:100%;margin:6px 0 8px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;min-height:80px;direction:ltr;font-size:13.5px}
@media (min-width:1040px){
  html{scroll-padding-top:20px}
  #app:has(.tabs){display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start}
  #app:has(.tabs) .top{height:100vh;height:100dvh;overflow-y:auto;box-shadow:none}
  #app:has(.tabs) .top .wrap{padding:14px 14px 20px}
  #app:has(.tabs) .bar{flex-direction:column;align-items:flex-start;gap:0;min-height:0}
  #app:has(.tabs) .bar .sp{display:none}
  #app:has(.tabs) .bar .sv{min-height:22px}
  #app:has(.tabs) .who{border-top:1px solid var(--bar-line);margin-top:8px;padding-block:14px 12px}
  #app:has(.tabs) .who b{flex-basis:100%;font-size:16.5px;line-height:1.5}
  #app:has(.tabs) .top .tabs{flex-direction:column;overflow:visible;padding-bottom:0;gap:2px}
  #app:has(.tabs) .top .tab{width:100%;justify-content:flex-start;min-height:42px;font-size:15px}
  #app:has(.tabs) .top .tab .bd{margin-inline-start:auto}
  #app:has(.tabs) main.wrap{width:100%;padding-inline:32px}
}

function jdLib(title){for(var i=0;i<JDL.length;i++)if(JDL[i][0].test(title||""))return JDL[i];return null}

function asm(c){return c.type==="llc"?"جمعية الشركاء":"الجمعية العامة"}
var DOCS={
report:{t:"تقرير تقييم الحوكمة",d:"ملخص تنفيذي، الوضع الحالي، الفجوات، التوصيات، خارطة الطريق. يُبنى من بيانات الملف.",f:function(c){
  var list=crits(c),man=list.filter(function(r){return force(r,c)==="M"}),sm=score(man,c),sa=score(list,c),m=matAvg(c),g=gaps(c),pl=c.plan||[];
  var h='<h2>1. الملخص التنفيذي</h2><p>أُجري هذا التقييم ل'+esc(co(c.name))+' ('+TYPES[c.type]+')'+(c.noMat?" على محور الالتزام بالمتطلبات النظامية في المملكة العربية السعودية.":" على محورين: الالتزام بالمتطلبات النظامية في المملكة العربية السعودية، ونضج قدرات الحوكمة والمخاطر والامتثال وفق نموذج OCEG.")+'</p><ul><li>نسبة الالتزام بالمتطلبات الإلزامية: '+(sm.pct==null?"لم تُقيَّم":sm.pct+"%")+' ('+sm.done+' من '+sm.total+' معياراً مقيّماً).</li><li>نسبة تطبيق جميع المعايير المنطبقة: '+(sa.pct==null?"لم تُقيَّم":sa.pct+"%")+'.</li>'+(c.obls.length?'<li>الامتثال لسجل الالتزامات: '+(compStat(c).pct==null?"لم يُقيَّم":compStat(c).pct+"%")+' ('+compStat(c).badM+' التزاماً إلزامياً غير متحقق، و'+compStat(c).late+' مراجعة متأخرة).</li>':'')+(c.noMat?"":'<li>متوسط نضج القدرات: '+(m==null?"لم يُقيَّم":m.toFixed(1)+" من 5")+'، والمستوى المستهدف '+(c.target||3)+'.</li>')+'<li>عدد الفجوات: '+g.length+'، منها '+g.filter(function(x){return x.f==="M"}).length+' في متطلبات إلزامية.</li></ul>';
  h+='<h2>2. الوضع الحالي</h2>'+(c.note?'<p>'+esc(c.note)+'</p>':"")+'<div class="tw"><table><tr><th>المجال</th><th>نسبة التطبيق</th><th>المقيّم</th></tr>';
  Object.keys(DOMS).forEach(function(d){var l=list.filter(function(r){return r[1]===d});if(!l.length)return;var s=score(l,c);h+='<tr><td>'+DOMS[d]+'</td><td>'+(s.pct==null?"—":s.pct+"%")+'</td><td>'+s.done+' من '+s.total+'</td></tr>'});
  h+='</table></div>';
  if(!c.noMat){h+='<div class="tw"><table><tr><th>مكون القدرات</th><th>متوسط النضج</th></tr>';
  Object.keys(COMP).forEach(function(k){var v=matAvg(c,k);h+='<tr><td>'+COMP[k][0]+' '+COMP[k][1]+'</td><td>'+(v==null?"—":v.toFixed(1)+" من 5")+'</td></tr>'});
  h+='</table></div>'}
  h+='<h2>3. تحليل الفجوات والتوصيات</h2>';
  h+=g.length?'<div class="tw"><table><tr><th>الفجوة</th><th>التصنيف</th><th>الوضع</th><th>التوصية</th></tr>'+g.map(function(x){return '<tr><td>'+x.title+'</td><td>'+(x.f==="O"?"نضج":FORCE[x.f][0])+'</td><td>'+x.why+'</td><td>'+x.fix+'</td></tr>'}).join("")+'</table></div>':'<p>لم تُسجل فجوات في المعايير المقيّمة.</p>';
  h+='<h2>4. خارطة الطريق</h2>'+(pl.length?'<div class="tw"><table><tr><th>المبادرة</th><th>الأولوية</th><th>المسؤول</th><th>الموعد</th><th>المخرج</th><th>الحالة</th></tr>'+pl.map(function(p){return '<tr><td>'+esc(p.title)+'</td><td>'+esc(p.prio)+'</td><td>'+esc(p.owner)+'</td><td>'+fmtD(p.due)+'</td><td>'+esc(p.out)+'</td><td>'+esc(p.status)+'</td></tr>'}).join("")+'</table></div>':'<p>لم تُعتمد خطة تنفيذ بعد.</p>');
  var rs=(c.risks||[]).slice().sort(function(a,b){return b.rl*b.ri-a.rl*a.ri}).slice(0,5);
  h+='<h2>5. أهم المخاطر</h2>'+(rs.length?'<div class="tw"><table><tr><th>الخطر</th><th>المتأصل</th><th>المتبقي</th><th>طريقة التعامل</th><th>الضوابط</th></tr>'+rs.map(function(r){return '<tr><td>'+esc(r.desc)+'</td><td>'+r.l*r.i+'</td><td>'+r.rl*r.ri+'</td><td>'+esc(r.opt)+'</td><td>'+esc(r.ctrl)+'</td></tr>'}).join("")+'</table></div>':'<p>لم تُسجل مخاطر.</p>');
  var ck=compStat(c);h+='<h2>6. الامتثال والالتزامات</h2>'+(c.obls.length?'<p>يضم سجل الالتزامات '+ck.total+' التزاماً: '+ck.ok+' ملتزم به، و'+ck.part+' جزئي، و'+ck.bad+' غير ملتزم، و'+ck.un+' لم يُقيَّم. نسبة الامتثال '+(ck.pct==null?"لم تُحسب":ck.pct+"%")+' (الجزئي بنصف نقطة). المراجعات المتأخرة: '+ck.late+'، والمستحقة خلال 30 يوماً: '+ck.soon+'.'+(ck.noEv?' يوجد '+ck.noEv+' التزاماً ملتزماً به دون دليل مسجل.':'')+'</p>'+(compExc(c).length?'<p><strong>الاستثناءات وما يحتاج متابعة:</strong></p>'+compTbl(compExc(c),compCols(false)):'<p>لا استثناءات: كل الالتزامات المقيّمة متحققة ومراجعاتها في موعدها.</p>'):'<p>لم يُسجَّل سجل التزامات بعد. يُنصح بتسجيل المتطلبات النظامية والتعاقدية ومتابعتها من تبويب «الامتثال».</p>');
  h+='<h2>7. مؤشرات المتابعة</h2><ul><li>نسبة الالتزام بالمتطلبات الإلزامية، والمستهدف 100%.</li><li>نسبة الامتثال لسجل الالتزامات وعدد المراجعات المتأخرة.</li>'+(c.noMat?"":"<li>متوسط نضج القدرات مقابل المستوى المستهدف.</li>")+'<li>نسبة إنجاز خطة التنفيذ وعدد المبادرات المتأخرة.</li><li>عدد المخاطر التي بقيت درجتها المتبقية عالية.</li></ul><h2>8. عوامل النجاح</h2><ul><li>التزام معلن من '+own(c)+' و'+body(c)+' بالخطة ومواعيدها.</li><li>مالك واحد لكل مبادرة، مزوّد بالصلاحية والموارد.</li><li>مراجعة دورية للتقدم، وإعادة التقييم بعد اكتمال المبادرات الإلزامية.</li></ul>';
  return h}},
board:{t:"ميثاق المجلس",d:"تكوين المجلس ومهامه واجتماعاته وأمين سره وتقييمه.",f:function(c){var L=c.type==="listed",B=body(c);
  return '<h2>1. الغرض</h2><p>يحدد هذا الميثاق تكوين '+B+' في '+esc(co(c.name))+' ومهامه وإجراءات عمله، بما لا يتعارض مع نظام الشركات وعقد التأسيس أو النظام الأساس.</p>'+
  '<h2>2. التكوين</h2><ol><li>يتكون المجلس من (....) أعضاء'+(c.type!=="llc"?"، على ألا يقل العدد عن ثلاثة":"")+'.</li>'+(L?'<li>تكون أغلبية الأعضاء من غير التنفيذيين.</li><li>لا يقل عدد الأعضاء المستقلين عن عضوين أو ثلث أعضاء المجلس، أيهما أكثر.</li>':'<li>يُستحسن أن يضم المجلس أعضاء غير تنفيذيين، وعضواً مستقلاً واحداً على الأقل.</li>')+'<li>مدة العضوية (....) سنوات بما لا يتجاوز المدة النظامية، ويجوز إعادة التعيين.</li></ol>'+
  '<h2>3. مهام المجلس</h2><ol><li>اعتماد التوجه الاستراتيجي والأهداف الرئيسية ومتابعة تنفيذها.</li><li>اعتماد الهيكل التنظيمي ومصفوفة الصلاحيات والسياسات الرئيسية.</li><li>الإشراف على نظام الرقابة الداخلية وإدارة المخاطر والتحقق من فعاليته.</li><li>اعتماد الموازنة والقوائم المالية والتوصية بها إلى '+asm(c)+'.</li><li>تعيين الرئيس التنفيذي وتحديد صلاحياته وتقييم أدائه.</li><li>وضع سياسة لتعارض المصالح ومتابعة تطبيقها.</li></ol>'+
  '<h2>4. رئيس المجلس</h2><p>يتولى الرئيس قيادة المجلس وضمان فاعليته، ويمثل الشركة وفق ما تحدده وثائقها.'+(L?" ولا يجوز أن يشغل رئيس المجلس أي منصب تنفيذي في الشركة، ويُعيَّن نائب للرئيس.":" ويُستحسن ألا يجمع الرئيس بين رئاسة المجلس ومنصب تنفيذي.")+'</p>'+
  '<h2>5. الاجتماعات</h2><ol><li>يجتمع المجلس أربع مرات على الأقل في السنة'+(L?"، وبما لا يقل عن اجتماع كل ثلاثة أشهر":"")+'.</li><li>لا يصح الاجتماع إلا بحضور نصف الأعضاء على الأقل.</li><li>تصدر القرارات بأغلبية آراء الحاضرين، وعند التساوي يرجح الجانب الذي صوت معه الرئيس، ما لم تنص وثائق الشركة على غير ذلك.</li><li>تُوثق المداولات والقرارات في محاضر يوقعها الرئيس والأعضاء الحاضرون وأمين السر.</li></ol>'+
  '<h2>6. أمين السر</h2><p>يعيّن المجلس أميناً للسر من أعضائه أو من غيرهم، يتولى توثيق الاجتماعات وحفظ المحاضر والسجلات وتزويد الأعضاء بجدول الأعمال والمستندات قبل الاجتماع بوقت كافٍ.</p>'+
  '<h2>7. واجبات الأعضاء</h2><ol><li>بذل العناية والولاء، والعمل لمصلحة الشركة.</li><li>الإفصاح عن أي مصلحة مباشرة أو غير مباشرة في أعمال الشركة وعقودها، والامتناع عن التصويت على القرار المتعلق بها.</li><li>عدم الاشتراك في عمل ينافس الشركة إلا بترخيص.</li><li>المحافظة على سرية معلومات الشركة.</li></ol>'+
  '<h2>8. اللجان</h2><p>للمجلس أن يشكل لجاناً تعاونه، ويحدد لكل لجنة مهامها ومدة عملها وصلاحياتها وطريقة رفع تقاريرها.'+(L?" وتُشكل لجنة للمراجعة ولجنة للمكافآت ولجنة للترشيحات، ويجوز دمج الأخيرتين.":"")+'</p>'+
  '<h2>9. التقييم</h2><p>يقيّم المجلس أداءه وأداء أعضائه ولجانه سنوياً، ويضع خطة لمعالجة ما يظهر من ملاحظات.</p><h2>10. المراجعة والاعتماد</h2><p>يُراجع هذا الميثاق كل سنتين أو عند الحاجة، ويسري من تاريخ اعتماده.</p>'}},
audit:{t:"ميثاق لجنة المراجعة",d:"تشكيل اللجنة واختصاصاتها واجتماعاتها وتقاريرها.",f:function(c){var L=c.type==="listed";
  return '<h2>1. التشكيل</h2><ol><li>تُشكل اللجنة بقرار من '+body(c)+' من ثلاثة إلى خمسة أعضاء.</li><li>لا يكون بين أعضائها أي عضو تنفيذي، ويكون أحدهم مختصاً بالشؤون المالية والمحاسبية.</li><li>'+(L?"يكون بين أعضائها عضو مستقل واحد على الأقل، ولا يكون رئيس المجلس عضواً فيها.":"يُستحسن أن يكون بين أعضائها عضو مستقل، وألا يكون رئيس المجلس عضواً فيها.")+'</li>'+(L?'<li>لا يكون عضواً فيها من عمل خلال السنتين السابقتين في الإدارة التنفيذية أو المالية للشركة أو لدى مراجع حساباتها.</li>':"")+'</ol>'+
  '<h2>2. الاختصاصات</h2><ol><li>دراسة القوائم المالية الأولية والسنوية قبل عرضها على المجلس وإبداء الرأي فيها.</li><li>دراسة نظم الرقابة الداخلية والمالية وإدارة المخاطر، وإعداد تقرير برأيها في كفايتها.</li><li>الإشراف على المراجعة الداخلية واعتماد خطتها ومتابعة ملاحظاتها.</li><li>التوصية بترشيح مراجع الحسابات وعزله وتحديد أتعابه، والتحقق من استقلاله.</li><li>مراجعة العقود والتعاملات مع الأطراف ذات العلاقة ورفع ما تراه بشأنها إلى المجلس.</li><li>وضع آلية تتيح للعاملين تقديم ملاحظاتهم عن أي تجاوز في التقارير المالية أو غيرها بسرية، والتحقق من إجراء تحقيق مستقل.</li></ol>'+
  '<h2>3. الاجتماعات</h2><ol><li>تجتمع اللجنة أربع مرات على الأقل في السنة المالية.</li><li>تجتمع دورياً مع مراجع الحسابات ومع المراجع الداخلي.</li><li>تُوثق اجتماعاتها في محاضر تُحفظ لدى أمين اللجنة.</li></ol>'+
  '<h2>4. التقارير</h2><p>ترفع اللجنة تقاريرها وتوصياتها إلى '+body(c)+'. وإذا لم يأخذ المجلس بتوصية للجنة، فيُبيَّن سبب ذلك.</p><h2>5. الصلاحيات</h2><p>للجنة الاطلاع على سجلات الشركة ووثائقها، وطلب أي إيضاح من أعضاء المجلس أو الإدارة التنفيذية، والاستعانة بمن تراه من الخبراء.</p><h2>6. المراجعة والاعتماد</h2><p>يُراجع هذا الميثاق سنوياً، ويسري من تاريخ اعتماده.</p>'}},
matrix:{t:"مصفوفة الصلاحيات",d:"من يعتمد ومن يوصي في أهم القرارات. تُبنى من مصفوفة الهيكل إن وُجدت، وإلا فمن قالب عام.",f:function(c){if(c.auth.length)return authDoc(c);var B=body(c),A=asm(c);
  var rows=[["تعديل عقد التأسيس أو النظام الأساس وزيادة رأس المال أو تخفيضه","يعتمد","يوصي","—","—"],["اعتماد القوائم المالية السنوية وتوزيع الأرباح","يعتمد","يوصي","يراجع","يعد"],["تعيين مراجع الحسابات وتحديد أتعابه","يعتمد","يوصي","—","—"],["اعتماد الاستراتيجية والموازنة السنوية","يُبلَّغ","يعتمد","يقترح","يعد"],["اعتماد الهيكل التنظيمي والسياسات الرئيسية","—","يعتمد","يقترح","—"],["تعيين الرئيس التنفيذي والمدير المالي وإعفاؤهما","—","يعتمد","يوصي (للمدير المالي)","—"],["العقود والتعاملات مع الأطراف ذات العلاقة","يرخص","يوصي","يفصح","يفصح"],["الإنفاق الرأسمالي فوق (....) ريال","—","يعتمد","يوصي","يراجع"],["الإنفاق الرأسمالي حتى (....) ريال","—","يُبلَّغ","يعتمد","يراجع"],["المصروفات التشغيلية ضمن الموازنة حتى (....) ريال","—","—","يعتمد","يراجع"],["الاقتراض والتسهيلات البنكية والضمانات","—","يعتمد","يوصي","يعد"],["فتح الحسابات البنكية وتحديد المفوضين بالتوقيع","—","يعتمد","يقترح","ينفذ"],["تعيين الموظفين دون مستوى الإدارة التنفيذية","—","—","يعتمد","—"],["شطب الديون والأصول فوق (....) ريال","—","يعتمد","يوصي","يعد"]];
  return '<p>تحدد هذه المصفوفة مستويات الصلاحية في '+esc(co(c.name))+'. المبالغ بين القوسين تُحدد بحسب حجم الشركة وتُعتمد من '+B+'.</p><div class="tw"><table><tr><th>القرار</th><th>'+A+'</th><th>'+B+'</th><th>الرئيس التنفيذي</th><th>المدير المالي</th></tr>'+rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+x+'</td>'}).join("")+'</tr>'}).join("")+'</table></div><h2>قواعد عامة</h2><ol><li>لا يعتمد صاحب الصلاحية معاملة له فيها مصلحة شخصية.</li><li>يُفصل بين من يطلب المعاملة ومن يعتمدها ومن يسجلها ومن يصرفها.</li><li>التفويض كتابي ومحدد المدة والحدود، ولا يعفي المفوِّض من مسؤوليته.</li><li>تُراجع المصفوفة سنوياً أو عند تغير الهيكل التنظيمي.</li></ol>'}},
coi:{t:"سياسة تعارض المصالح",d:"الإفصاح والترخيص والامتناع عن التصويت وتعاملات الأطراف ذات العلاقة.",f:function(c){var L=c.type==="listed";
  return '<h2>1. الغرض والنطاق</h2><p>تهدف هذه السياسة إلى حماية مصالح '+esc(co(c.name))+' و'+own(c)+' من أي تعارض بين مصلحة الشركة والمصلحة الشخصية. وتسري على '+(hasBoard(c)?"أعضاء المجلس واللجان":"المديرين")+' والإدارة التنفيذية وجميع العاملين.</p>'+
  '<h2>2. المقصود بتعارض المصالح</h2><p>كل حالة تكون فيها للشخص، أو لأحد أقاربه أو لمنشأة له فيها حصة مؤثرة، مصلحة مباشرة أو غير مباشرة قد تؤثر في حياده عند اتخاذ قرار يخص الشركة.</p>'+
  '<h2>3. الالتزامات</h2><ol><li>الإفصاح كتابةً عن أي مصلحة في الأعمال والعقود التي تتم لحساب الشركة فور العلم بها.</li><li>الحصول على الترخيص اللازم من '+asm(c)+' أو من يفوضه قبل إتمام التعامل.</li><li>الامتناع عن الاشتراك في المداولة والتصويت على القرار المتعلق بالمصلحة.</li><li>عدم الاشتراك في أي عمل من شأنه منافسة الشركة إلا بترخيص.</li><li>عدم قبول هدايا أو منافع من الغير بسبب المنصب.</li><li>عدم استغلال أصول الشركة أو معلوماتها لمصلحة شخصية.</li></ol>'+
  '<h2>4. التعاملات مع الأطراف ذات العلاقة</h2><ol><li>تُعرض على لجنة المراجعة أو من يقوم مقامها قبل اعتمادها.</li><li>تتم بشروط لا تقل عن شروط التعامل مع الغير.</li><li>تُقيد في سجل خاص يبين طبيعتها وقيمتها وصاحب المصلحة فيها.</li>'+(L?'<li>يُفصح للهيئة وللجمهور دون تأخير عن التعامل الذي تساوي قيمته 1% من إجمالي الإيرادات أو تزيد عليها.</li>':"")+'</ol>'+

code:{t:"مدونة السلوك المهني",d:"القيم والتزامات العاملين: النزاهة والهدايا والسرية وحماية الأصول.",f:function(c){
  return '<h2>1. الغرض والنطاق</h2><p>تحدد هذه المدونة القيم ومعايير السلوك التي تلتزم بها '+esc(co(c.name))+'، وتسري على '+(hasBoard(c)?"أعضاء المجلس ولجانه":"المديرين")+' والإدارة التنفيذية وجميع العاملين، وعلى من يعمل باسم الشركة من الغير.</p><h2>2. قيم الشركة</h2><p>(تُدرج هنا قيم الشركة المعتمدة، مثل: النزاهة، المسؤولية، احترام العميل، الإتقان.)</p>'+
  '<h2>3. الالتزامات</h2><ol><li><strong>النزاهة والأمانة:</strong> أداء العمل بصدق، وعدم تقديم معلومات مضللة داخل الشركة أو خارجها.</li><li><strong>الالتزام بالأنظمة:</strong> التقيد بالأنظمة واللوائح السارية وسياسات الشركة.</li><li><strong>تعارض المصالح:</strong> الإفصاح عن أي مصلحة شخصية، وفق سياسة تعارض المصالح.</li><li><strong>الهدايا والضيافة:</strong> عدم قبول أو تقديم هدية أو منفعة قد تؤثر في القرار. ما تجاوزت قيمته (....) ريال يُرفض أو يُبلَّغ عنه.</li><li><strong>مكافحة الرشوة والاحتيال:</strong> لا تسامح مع الرشوة أو الاحتيال بأي صورة.</li><li><strong>السرية:</strong> المحافظة على معلومات الشركة وعملائها، أثناء الخدمة وبعدها.</li><li><strong>حماية الأصول:</strong> استخدام أصول الشركة وأنظمتها لأغراض العمل فقط.</li><li><strong>دقة السجلات:</strong> تسجيل المعاملات كاملةً وفي وقتها، وعدم إخفاء أي منها.</li><li><strong>بيئة العمل:</strong> معاملة الزملاء والمتعاملين باحترام وعدل، ودون تمييز أو إساءة.</li></ol>'+
  '<h2>4. الاستفسار والإبلاغ</h2><p>من شك في صحة تصرف فليستشر مديره أو الجهة المختصة قبل الإقدام عليه. ومن علم بمخالفة فعليه الإبلاغ عنها وفق سياسة الإبلاغ عن المخالفات، ولا يُضار من أبلغ بحسن نية.</p><h2>5. المخالفات</h2><p>تُعالج مخالفة هذه المدونة وفق لائحة تنظيم العمل في الشركة والأنظمة ذات العلاقة، وتُطبق الجزاءات على الجميع دون تفرقة.</p><h2>6. الإقرار</h2><p>يوقع كل مشمول بالمدونة إقراراً بالاطلاع عليها عند التحاقه، ويجدده سنوياً.</p>'}},
disclosure:{t:"سياسة الإفصاح",d:"مبادئ الإفصاح وما يُفصح عنه ومن يملك صلاحية النشر.",f:function(c){var L=c.type==="listed";
  return '<h2>1. الغرض</h2><p>تنظم هذه السياسة إفصاح '+esc(co(c.name))+' عن معلوماتها ل'+own(c)+' وأصحاب المصلحة، بما يضمن وصول معلومة صحيحة وكافية في وقتها.'+(L?" وتُطبق مع ما تقرره أنظمة هيئة السوق المالية ولوائحها وقواعد السوق، وهي المقدَّمة عند التعارض.":"")+'</p>'+
  '<h2>2. المبادئ</h2><ol><li>الدقة والوضوح وعدم التضليل.</li><li>الإفصاح في الوقت المناسب ودون تأخير غير مبرر.</li><li>العدالة: تصل المعلومة إلى جميع '+own(c)+' دون تمييز.</li><li>لا يُفصح عن معلومة سرية إلا لمن له حق نظامي فيها.</li></ol>'+
  '<h2>3. ما يُفصح عنه</h2><ul><li>القوائم المالية'+(L?" الأولية والسنوية":" السنوية")+'.</li>'+(hasBoard(c)?'<li>تقرير المجلس السنوي.</li>':"")+'<li>التعاملات مع الأطراف ذات العلاقة وما رُخص منها.</li><li>التطورات الجوهرية التي تؤثر في أصول الشركة أو التزاماتها أو وضعها المالي.</li><li>التغيرات في '+(hasBoard(c)?"عضوية المجلس و":"")+'الإدارة التنفيذية.</li></ul>'+
  '<h2>4. الصلاحيات والإجراءات</h2><ol><li>المتحدث المخول باسم الشركة: (....). ولا يصرح غيره للإعلام أو للغير.</li><li>تُراجع كل معلومة قبل نشرها من المدير المالي والجهة القانونية، وتُعتمد من (....).</li><li>يُحفظ سجل بما أُفصح عنه وتاريخه ومن اعتمده.</li><li>إذا نُشرت معلومة خاطئة، تُصحح فور اكتشافها بالوسيلة نفسها.</li></ol><h2>5. المراجعة والاعتماد</h2><p>تُراجع هذه السياسة كل سنتين، وتسري من تاريخ اعتمادها.</p>'}},
nomrem:{t:"لائحة لجنة المكافآت والترشيحات",d:"تشكيل اللجنة واختصاصاتها في المكافآت والترشيح.",f:function(c){var L=c.type==="listed";
  return '<h2>1. التشكيل</h2><ol><li>تُشكل اللجنة بقرار من '+body(c)+' من ثلاثة أعضاء على الأقل.</li><li>لا يكون بين أعضائها أي عضو تنفيذي، ويكون بينهم عضو مستقل واحد على الأقل.</li><li>'+(L?"يكون رئيس اللجنة من الأعضاء المستقلين.":"يُستحسن أن يرأس اللجنة عضو مستقل.")+'</li></ol>'+
  '<h2>2. اختصاصات المكافآت</h2><ol><li>إعداد سياسة واضحة لمكافآت أعضاء المجلس ولجانه والإدارة التنفيذية، ورفعها إلى المجلس تمهيداً لاعتمادها من '+asm(c)+'.</li><li>ربط الجزء المتغير من المكافآت بالأداء على المدى الطويل.</li><li>مراجعة السياسة دورياً وتقييم مدى تحقيقها لأهدافها.</li><li>التوصية للمجلس بمكافآت الأعضاء وكبار التنفيذيين وفق السياسة المعتمدة.</li></ol>'+
  '<h2>3. اختصاصات الترشيحات</h2><ol><li>اقتراح سياسات ومعايير واضحة للعضوية في المجلس والإدارة التنفيذية.</li><li>التوصية للمجلس بترشيح الأعضاء وإعادة ترشيحهم.</li><li>إعداد وصف للقدرات والمؤهلات المطلوبة للعضوية ولشغل وظائف الإدارة التنفيذية.</li><li>المراجعة السنوية للاحتياجات من المهارات والخبرات، ولاستقلال الأعضاء المستقلين، ولعدم وجود تعارض مصالح.</li><li>وضع إجراءات لحالة شغور مركز أحد الأعضاء أو كبار التنفيذيين، وخطة للتعاقب.</li></ol>'+
  '<h2>4. الاجتماعات</h2><p>تجتمع اللجنة مرة كل ستة أشهر على الأقل، وكلما دعت الحاجة. وتُوثق اجتماعاتها في محاضر.</p><h2>5. التقارير</h2><p>ترفع اللجنة توصياتها وتقاريرها إلى '+body(c)+'.</p><h2>6. المراجعة والاعتماد</h2><p>تُراجع هذه اللائحة كل سنتين، وتسري من تاريخ اعتمادها.</p>'}},
risk:{t:"إطار إدارة المخاطر",d:"الأدوار والمنهجية ومقياس التقييم ونطاقات القبول والتقارير.",f:function(c){
  return '<h2>1. الغرض</h2><p>يضع هذا الإطار منهج '+esc(co(c.name))+' في تحديد ما قد يؤثر في أهدافها وتحليله ومعالجته ومتابعته، سواء كان فرصة أو عقبة.</p>'+
  '<h2>2. الأدوار</h2><ol><li><strong>'+body(c)+':</strong> يعتمد الإطار ونطاقات القبول، ويراجع أهم المخاطر دورياً.</li><li><strong>الإدارة التنفيذية:</strong> تطبق الإطار وتضمن وجود مالك لكل خطر.</li><li><strong>ملاك المخاطر في الإدارات (الخط الأول):</strong> يحددون مخاطر أعمالهم ويديرون ضوابطها.</li><li><strong>وظيفة إدارة المخاطر (الخط الثاني):</strong> تضع المنهجية والأدوات وتجمع السجل وترفع التقارير.</li><li><strong>المراجعة الداخلية (الخط الثالث):</strong> تقدم ضماناً مستقلاً عن فعالية الإطار.</li></ol>'+
  '<h2>3. المنهجية</h2><ol><li><strong>التحديد:</strong> من الأهداف أولاً، بالجمع بين نظرة الإدارة العليا وما يرفعه العاملون.</li><li><strong>التحليل:</strong> تُقدَّر الاحتمالية والأثر، كل منهما من 1 إلى 5، والدرجة حاصل ضربهما.</li><li><strong>المعالجة:</strong> يُختار لكل خطر أحد أربعة خيارات: التفادي، القبول، المشاركة، التحكم.</li><li><strong>المتابعة:</strong> تُقاس الدرجة المتأصلة قبل الضوابط والمتبقية بعدها.</li></ol>'+
  '<div class="tw"><table><tr><th>الدرجة</th><th>المستوى</th><th>المطلوب</th></tr><tr><td>15 إلى 25</td><td>عالٍ</td><td>خطة معالجة فورية وعرض على '+body(c)+'.</td></tr><tr><td>8 إلى 14</td><td>متوسط</td><td>ضوابط إضافية ومتابعة ربع سنوية.</td></tr><tr><td>1 إلى 7</td><td>منخفض</td><td>قبول مع متابعة سنوية.</td></tr></table></div>'+
  '<h2>4. نطاقات القبول والتحمل</h2><p>يحدد '+body(c)+' لكل هدف رئيسي النطاق المقبول، ونطاق التحمل الذي يستدعي إجراء، والحد الذي لا تطيقه الشركة. مثال: (....).</p><h2>5. السجل والتقارير</h2><ol><li>يُحفظ سجل موحد للمخاطر يبين الوصف والمالك والدرجتين والضوابط.</li><li>يُحدَّث السجل كل ربع سنة، وعند أي تغير جوهري.</li><li>يُرفع تقرير بأهم المخاطر إلى '+body(c)+' مرتين في السنة على الأقل.</li></ol><h2>6. المراجعة والاعتماد</h2><p>يُراجع هذا الإطار سنوياً، ويسري من تاريخ اعتماده.</p>'}},
dividend:{t:"سياسة توزيع الأرباح",d:"أسس التوزيع وآليته وما يُراعى قبل التوصية به.",f:function(c){
  return '<h2>1. الغرض</h2><p>تبين هذه السياسة الأسس التي تتبعها '+esc(co(c.name))+' في توزيع الأرباح على '+own(c)+'، بما يوازن بين عائدهم واحتياجات الشركة، ودون إخلال بنظام الشركات وعقد التأسيس أو النظام الأساس.</p>'+
  '<h2>2. ما يُراعى قبل التوصية بالتوزيع</h2><ol><li>الأرباح القابلة للتوزيع بحسب القوائم المالية المعتمدة.</li><li>السيولة والتدفقات النقدية المتوقعة.</li><li>الخطط الاستثمارية والتوسعية واحتياجات رأس المال العامل.</li><li>الالتزامات والتعهدات تجاه الجهات الممولة.</li><li>الاحتياطيات التي تنص عليها وثائق الشركة أو يقررها '+asm(c)+'.</li></ol>'+
  '<h2>3. الآلية</h2><ol><li>يوصي '+body(c)+' بالتوزيع بعد اعتماد القوائم المالية.</li><li>يصدر قرار التوزيع من '+asm(c)+'، ويحدد المبلغ وتاريخ الاستحقاق وتاريخ الصرف.</li><li>يجوز توزيع أرباح مرحلية متى أجازت ذلك وثائق الشركة ووُجد التفويض اللازم.</li><li>النسبة المستهدفة للتوزيع: (....)% من صافي الربح، وهي استرشادية لا التزام.</li></ol>'+
  '<h2>4. الإبلاغ</h2><p>يُبلَّغ '+own(c)+' بقرار التوزيع وموعد الصرف فور صدوره.</p><h2>5. المراجعة والاعتماد</h2><p>تُراجع هذه السياسة كل سنتين أو عند تغير جوهري في وضع الشركة، وتسري من تاريخ اعتمادها.</p>'}},
orgdoc:{t:"الهيكل التنظيمي",d:"شجرة الارتباط الإداري وجدول الوحدات وشاغليها. يُبنى من تبويب الهيكل.",data:1,f:function(c){
  if(!c.org.length)return '<p>لم يُبنَ الهيكل بعد. ابدأ من تبويب «الهيكل والوظائف».</p>';
  return '<h2>1. المخطط التنظيمي</h2>'+orgChart(c)+'<h2>2. شجرة الارتباط</h2>'+orgTree(c,"",1)+'<h2>3. جدول الوحدات</h2><div class="tw"><table><tr><th>الوحدة أو الوظيفة</th><th>النوع</th><th>ترتبط بـ</th><th>شاغلها</th></tr>'+c.org.map(function(n){var p=onode(c,opar(c,n));return '<tr><td>'+esc(n.title)+'</td><td>'+n.kind+'</td><td>'+(p?esc(p.title):"—")+'</td><td>'+esc(n.holder)+'</td></tr>'}).join("")+'</table></div>'}},
jds:{t:"بطاقات الوصف الوظيفي",d:"بطاقة لكل وظيفة: الغرض والمهام والمؤهلات والمؤشرات والصلاحيات.",data:1,f:function(c){
  var js=c.org.filter(function(n){return n.kind!==NK[0]&&jdDone(n)});
  if(!js.length)return '<p>لا توجد أوصاف وظيفية مكتملة بعد. اكتبها من تبويب «الهيكل والوظائف».</p>';
  var ol=function(s){var l=lines(s);return l.length?'<ol style="margin:0">'+l.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol>':""};
  return js.map(function(n){var j=n.jd,p=onode(c,opar(c,n)),k=okids(c,n.id).map(function(x){return esc(x.title)}).join("، ");
    return '<h2>'+esc(n.title)+'</h2><div class="tw"><table><tr><th style="width:28%">يرتبط بـ</th><td>'+(p?esc(p.title):"—")+'</td></tr><tr><th>يشرف على</th><td>'+(k||"—")+'</td></tr>'+(n.holder?'<tr><th>شاغل الوظيفة</th><td>'+esc(n.holder)+'</td></tr>':"")+'<tr><th>الغرض</th><td>'+esc(j.purpose)+'</td></tr><tr><th>المهام والمسؤوليات</th><td>'+ol(j.duties)+'</td></tr><tr><th>المؤهلات</th><td>'+esc(j.quals)+'</td></tr><tr><th>الخبرة</th><td>'+esc(j.exp)+'</td></tr><tr><th>مؤشرات الأداء</th><td>'+ol(j.kpis)+'</td></tr><tr><th>الصلاحيات</th><td>'+esc(j.auth)+(function(){var s=authSum(c,n.id);return s.length?'<ul style="margin:6px 0 0;padding-inline-start:1.2em">'+s.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>':""})()+'</td></tr></table></div>'}).join("")}},
minutes:{t:"محاضر الاجتماعات وسجل القرارات",d:"محضر مختصر لكل اجتماع مسجل، ثم سجل موحد بالقرارات وحالتها.",data:1,f:function(c){
  if(!c.meets.length)return '<p>لا اجتماعات مسجلة. سجّلها من تبويب «المجلس والتقويم».</p>';
  var ms=c.meets.slice().sort(function(a,b){return (a.date||"")>(b.date||"")?-1:1}),h="",n=0;
  ms.forEach(function(m){var q=quorum(c,m);h+='<h2>'+esc(m.body)+'، '+(fmtD(m.date)||"بلا تاريخ")+'</h2><p>عدد الحاضرين: '+(esc(m.att)||"—")+(q?"، "+(q[0]?"النصاب مكتمل":"النصاب غير مكتمل")+" ("+q[1]+")":"")+'</p>'+(m.agenda?'<p><strong>جدول الأعمال وأهم ما دار:</strong> '+esc(m.agenda)+'</p>':"")+(m.res.length?'<p><strong>القرارات:</strong></p><ol>'+m.res.map(function(r){return '<li>'+esc(r.text)+(r.owner?" (المسؤول: "+esc(r.owner)+(r.due?"، الموعد: "+fmtD(r.due):"")+")":"")+'</li>'}).join("")+'</ol>':'<p>لم تُسجل قرارات.</p>')+'<div class="sig"><div>رئيس الاجتماع:</div><div>أمين السر:</div></div>'});
  h+='<h2>سجل القرارات</h2><div class="tw"><table><tr><th>م</th><th>القرار</th><th>الجهة والتاريخ</th><th>المسؤول</th><th>الموعد</th><th>الحالة</th></tr>';
  ms.forEach(function(m){m.res.forEach(function(r){n++;h+='<tr><td>'+n+'</td><td>'+esc(r.text)+'</td><td>'+esc(m.body)+'، '+fmtD(m.date)+'</td><td>'+esc(r.owner)+'</td><td>'+fmtD(r.due)+'</td><td>'+esc(r.status)+(resLate(r)?" (فات موعده)":"")+'</td></tr>'})});
  return h+'</table></div>'}},
discreg:{t:"سجل الإفصاحات وتعاملات الأطراف ذات العلاقة",d:"جدول بكل إفصاح مسجل وحالة عرضه والترخيص به. يُبنى من تبويب المجلس.",data:1,f:function(c){
  if(!c.disc.length)return '<p>لا إفصاحات مسجلة. سجّلها من تبويب «المجلس والتقويم»، قسم الإفصاحات.</p>';
  return '<p>يعرض هذا السجل ما أُفصح عنه من مصالح وتعاملات وأعمال منافسة لدى '+esc(co(c.name))+' حتى '+fmtD(today())+'، عملاً بنظام الشركات (م27 وم71).</p><div class="tw"><table><tr><th>م</th><th>صاحب المصلحة</th><th>صفته</th><th>النوع</th><th>الوصف</th><th>القيمة</th><th>التاريخ</th><th>الحالة</th><th>المرجع</th></tr>'+c.disc.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(x.party)+'</td><td>'+esc(x.rel)+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.amount)+'</td><td>'+fmtD(x.date)+'</td><td>'+esc(x.appr)+'</td><td>'+esc(x.note)+'</td></tr>'}).join("")+'</table></div><div class="sig"><div>أمين السر:</div><div>رئيس '+body(c)+':</div></div>'}},
beval:{t:"تقرير تقييم أداء المجلس",d:"نتائج آخر تقييم ذاتي للمجلس بمحاوره وأولويات التحسين.",data:1,f:function(c){
  if(!c.evals.length)return '<p>لا تقييم مسجل. ابدأه من تبويب «المجلس والتقويم»، قسم تقييم المجلس.</p>';
  var ev=c.evals[c.evals.length-1],av=evAvg(ev),wk=evWeak(ev),h='<p>أجرى '+body(c)+' في '+esc(co(c.name))+' تقييماً ذاتياً لأدائه عن سنة '+esc(ev.year)+' على 12 بنداً بدرجة من 1 إلى 5. المتوسط العام: '+(av==null?"لم يُحسب":av.toFixed(1)+" من 5")+'.</p><h2>1. النتائج حسب المحور</h2><div class="tw"><table><tr><th>المحور</th><th>المتوسط</th></tr>'+EVG.map(function(g,k){var v=evAvg(ev,k);return '<tr><td>'+g+'</td><td>'+(v==null?"—":v.toFixed(1))+'</td></tr>'}).join("")+'</table></div><h2>2. النتائج التفصيلية</h2><div class="tw"><table><tr><th>البند</th><th>الدرجة</th></tr>'+EVQ.map(function(q){var v=ev.sc[q[0]];return '<tr><td>'+q[2]+'</td><td>'+(v?v+" ("+EVL[v]+")":"—")+'</td></tr>'}).join("")+'</table></div><h2>3. أولويات التحسين</h2>'+(wk.length?'<ol>'+wk.map(function(q){return '<li>'+q[3]+'.</li>'}).join("")+'</ol>':'<p>لا بنود بدرجة 3 أو أقل.</p>');
  return h+(ev.note?'<h2>4. ملاحظات المجلس</h2><p>'+esc(ev.note)+'</p>':"")+'<div class="sig"><div>أمين السر:</div><div>رئيس '+body(c)+':</div></div>'}},
bsc:{t:"بطاقة الأداء المتوازن",d:"الأهداف والمؤشرات على المناظير الأربعة مع التقدم نحو المستهدف. تُبنى من تبويب الأهداف.",data:1,f:function(c){
  if(!c.kpis.length)return '<p>لم تُسجل أهداف بعد. ابدأ من تبويب «الأهداف والمؤشرات».</p>';
  var h='<p>تعرض هذه البطاقة أهداف '+esc(co(c.name))+' ومؤشراتها حتى '+fmtD(today())+'.</p>';
  PSP.forEach(function(ps,i){var l=c.kpis.filter(function(x){return x.persp===ps});if(!l.length)return;h+='<h2>'+(i+1)+'. منظور '+ps+'</h2><div class="tw"><table><tr><th>الهدف</th><th>المؤشر</th><th>الأساس</th><th>المستهدف</th><th>الحالي</th><th>التقدم</th><th>المالك</th></tr>'+l.map(function(x){var p=kProg(x);return '<tr><td>'+esc(x.obj)+'</td><td>'+esc(x.ind)+(x.unit?" ("+esc(x.unit)+")":"")+'</td><td>'+esc(x.base)+'</td><td>'+esc(x.target)+'</td><td>'+esc(x.cur)+'</td><td>'+(p==null?"لم يُقس":p+"%، "+kStat(x)[0])+'</td><td>'+esc(x.owner)+'</td></tr>'}).join("")+'</table></div>'});
  return h}},
proposal:{t:"عرض خدمات الحوكمة",d:"نطاق العمل ومراحله ومخرجاته ومتطلباته، مبني على فجوات هذا الملف. تملأ الأتعاب والمدد.",data:1,f:function(c){
  var g=gaps(c),man=g.filter(function(x){return x.f==="M"}),dels=[];g.forEach(function(x){if(dels.indexOf(x.fix)<0)dels.push(x.fix)});
  return '<h2>1. الخلفية</h2><p>ترغب '+esc(co(c.name))+' ('+TYPES[c.type]+(c.sector?"، قطاع "+esc(c.sector):"")+') في بناء إطار حوكمة يتوافق مع الأنظمة السارية في المملكة العربية السعودية ويرفع نضج قدراتها في الحوكمة والمخاطر والالتزام.'+(g.length?" وأظهر التقييم الأولي "+g.length+" فجوة، منها "+man.length+" في متطلبات إلزامية.":"")+'</p>'+
  '<h2>2. هدف المشروع</h2><ul><li>معالجة الفجوات في المتطلبات الإلزامية أولاً.</li><li>بناء وثائق الحوكمة الأساسية واعتمادها.</li><li>توضيح الهيكل والصلاحيات والمسؤوليات.</li><li>وضع آلية متابعة تبقي الإطار حياً بعد انتهاء المشروع.</li></ul>'+
  '<h2>3. نطاق العمل ومراحله</h2><div class="tw"><table><tr><th>المرحلة</th><th>الأعمال</th><th>المدة</th></tr>'+
  '<tr><td>1. التشخيص</td><td>تقييم الالتزام النظامي ونضج القدرات، مقابلات مع '+body(c)+' والإدارة، مراجعة الوثائق القائمة، تقرير الفجوات.</td><td>(....) أسابيع</td></tr>'+
  '<tr><td>2. التصميم</td><td>الهيكل التنظيمي، مصفوفة الصلاحيات، بطاقات الوصف الوظيفي، المواثيق والسياسات المطلوبة.</td><td>(....) أسابيع</td></tr>'+
  '<tr><td>3. الاعتماد</td><td>مراجعة المسودات مع الإدارة والمستشار القانوني للشركة، وعرضها للاعتماد.</td><td>(....) أسابيع</td></tr>'+
  '<tr><td>4. التطبيق</td><td>خطة تنفيذ بمسؤولين ومواعيد، سجل المخاطر والالتزامات، تقويم الحوكمة، توعية المعنيين.</td><td>(....) أسابيع</td></tr>'+
  '<tr><td>5. المتابعة</td><td>تقارير متابعة دورية، وإعادة تقييم بعد (....) أشهر لقياس التقدم.</td><td>مستمرة</td></tr></table></div>'+
  '<h2>4. المخرجات</h2>'+(dels.length?'<ol>'+dels.slice(0,20).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol>'+(dels.length>20?'<p>وبقية المعالجات الواردة في تقرير التقييم.</p>':""):'<ul><li>تقرير تقييم الحوكمة وتحليل الفجوات.</li><li>دليل الحوكمة والمواثيق والسياسات الأساسية.</li><li>الهيكل التنظيمي ومصفوفة الصلاحيات وبطاقات الوصف الوظيفي.</li><li>خطة التنفيذ وسجل المخاطر والالتزامات.</li></ul>')+
  '<h2>5. المطلوب من الشركة</h2><ul><li>تسمية منسق للمشروع له صلاحية الوصول إلى المعلومات.</li><li>توفير عقد التأسيس أو النظام الأساس والسياسات والمحاضر القائمة.</li><li>إتاحة '+(hasBoard(c)?"أعضاء المجلس و":"")+'الإدارة التنفيذية للمقابلات.</li><li>مراجعة المسودات والرد عليها خلال (....) أيام عمل.</li></ul>'+
  '<h2>6. الأتعاب</h2><p>(....) ريال، تُدفع على (....) دفعات مرتبطة بتسليم المراحل. لا تشمل ضريبة القيمة المضافة.</p>'+
  '<h2>7. حدود العمل</h2><ul><li>الوثائق تُعد وفق الأنظمة السارية وقت إعدادها، ومسؤولية اعتمادها وتطبيقها على الشركة.</li><li>العمل لا يتضمن رأياً قانونياً ولا مراجعة للقوائم المالية. ما يحتاج رأياً قانونياً يُحال إلى مستشار الشركة القانوني.</li><li>أي عمل خارج هذا النطاق يُتفق عليه كتابةً.</li></ul>'+
  '<div class="sig"><div>المستشار:</div><div>عن الشركة:</div></div>'}},
comprep:{t:"تقرير الامتثال",d:"نسبة الامتثال وحالة الالتزامات والاستثناءات والإجراءات التصحيحية والمراجعات المتأخرة. يُبنى من تبويب الامتثال.",data:1,f:function(c){
  var o=c.obls||[];if(!o.length)return '<p>لا التزامات مسجلة. سجّلها أو استوردها من تبويب «الامتثال» ثم أعد فتح التقرير.</p>';
  var k=compStat(c),ex=compExc(c),man=o.filter(function(x){return x.kind==="إجباري"}),mk=man.filter(function(x){return x.status===OST[1]}).length;
  return '<h2>1. الملخص</h2><p>يعرض هذا التقرير حالة امتثال '+esc(co(c.name))+' للمتطلبات المسجلة في سجل الالتزامات حتى '+fmtD(today())+'.</p><ul><li>عدد الالتزامات: '+k.total+' ('+man.length+' إلزامياً).</li><li>نسبة الامتثال: '+(k.pct==null?"لم تُحسب":k.pct+"%")+' (مقيّم منها '+k.ev+')، والجزئي بنصف نقطة.</li><li>المتحقق من الالتزامات الإلزامية: '+mk+' من '+man.length+'.</li><li>الالتزامات غير المتحققة: '+k.bad+'، منها '+k.badM+' إلزامياً.</li><li>مراجعات فات موعدها: '+k.late+'، ومستحقة خلال 30 يوماً: '+k.soon+'.</li>'+(k.noEv?'<li>التزامات ملتزم بها بلا دليل مسجل: '+k.noEv+'.</li>':'')+'</ul>'+
  '<h2>2. الحالة بحسب الالتزام</h2>'+compTbl(o,compCols(true))+
  '<h2>3. الاستثناءات والإجراءات التصحيحية</h2>'+(ex.length?compTbl(ex,compCols(false)):'<p>لا استثناءات.</p>')+
  '<h2>4. التوصيات</h2><ol>'+(k.badM?'<li>معالجة '+k.badM+' التزاماً إلزامياً غير متحقق بخطة ذات مالك وموعد، وعرضها على '+body(c)+'.</li>':'')+(k.late?'<li>إجراء '+k.late+' مراجعة متأخرة وتسجيلها بتاريخها.</li>':'')+(k.noEv?'<li>إرفاق الدليل بالالتزامات الملتزم بها ليصمد الالتزام أمام المراجعة.</li>':'')+(k.un?'<li>تقييم '+k.un+' التزاماً لم يُقيَّم بعد.</li>':'')+'<li>مراجعة السجل دورياً وفق دورية كل التزام، وتحديث حالته.</li></ol>'+
  '<div class="sig"><div>أعده مسؤول الامتثال:</div><div>اطلع عليه '+body(c)+' بتاريخ:</div></div>'}},
compreg:{t:"سجل الالتزامات النظامية",d:"جدول بكل التزام: المصدر والنوع والحالة والمالك والدورية ومواعيد المراجعة والدليل. يُبنى من تبويب الامتثال.",data:1,f:function(c){
  var o=c.obls||[];if(!o.length)return '<p>لا التزامات مسجلة. سجّلها من تبويب «الامتثال».</p>';
  return '<p>سجل التزامات '+esc(co(c.name))+' النظامية والتعاقدية حتى '+fmtD(today())+'. لكل التزام مالك ودليل وموعد مراجعة.</p>'+compTbl(o,compCols(true))+'<div class="sig"><div>مسؤول الامتثال:</div><div>اعتمده '+body(c)+' بتاريخ:</div></div>'}},
compplan:{t:"خطة الامتثال والمراجعات",d:"مواعيد مراجعة الالتزامات مرتبة زمنياً، مع الإجراءات التصحيحية المسجلة في خطة التنفيذ. يُبنى من تبويب الامتثال.",data:1,f:function(c){
  var o=(c.obls||[]).filter(function(x){return x.next}).sort(function(a,b){return a.next<b.next?-1:1});
  var fx=(c.plan||[]).filter(function(p){return /^ob-/.test(p.ref||"")});
  var nn=(c.obls||[]).length-o.length;
  return '<p>تحدد هذه الخطة مواعيد مراجعة التزامات '+esc(co(c.name))+' والإجراءات التصحيحية المرتبطة بها حتى '+fmtD(today())+'.</p><h2>1. جدول المراجعات</h2>'+(o.length?compTbl(o,[["الموعد",function(r){return fmtD(r.next)+(compLate(r)?" (متأخر)":"")}],["الالتزام",function(r){return esc(r.req)}],["الحالة",function(r){return esc(r.status)}],["المالك",function(r){return esc(r.owner)||"—"}],["الدورية",function(r){return esc(r.freq||"—")}],["آخر مراجعة",function(r){return fmtD(r.last)||"—"}]]):'<p>لا مواعيد مراجعة محددة بعد.</p>')+(nn>0?'<p>'+nn+' التزاماً بلا موعد مراجعة. حدّد دوريتها من تبويب «الامتثال».</p>':'')+
  '<h2>2. الإجراءات التصحيحية</h2>'+(fx.length?compTbl(fx,[["الإجراء",function(r){return esc(r.title)}],["الأولوية",function(r){return esc(r.prio)}],["المسؤول",function(r){return esc(r.owner)||"—"}],["الموعد",function(r){return (fmtD(r.due)||"—")+(late(r)?" (متأخر)":"")}],["الحالة",function(r){return esc(r.status)}]]):'<p>لا إجراءات تصحيحية مضافة إلى خطة التنفيذ.</p>')+
  '<div class="sig"><div>مسؤول الامتثال:</div><div>اعتمده '+body(c)+' بتاريخ:</div></div>'}},
compol:{t:"سياسة الامتثال",d:"الأدوار والمسؤوليات وسجل الالتزامات والمراقبة والمراجعة الدورية والإبلاغ عن المخالفات والتدريب.",f:function(c){var L=c.type==="listed";
  return '<h2>1. الغرض والنطاق</h2><p>تضمن هذه السياسة التزام '+esc(co(c.name))+' بالأنظمة واللوائح والتعليمات السارية في المملكة العربية السعودية وبالتزاماتها التعاقدية وسياساتها الداخلية، وتسري على '+(hasBoard(c)?"أعضاء المجلس واللجان":"المديرين")+' والإدارة التنفيذية وجميع العاملين.</p>'+
  '<h2>2. الأدوار والمسؤوليات</h2><ol><li><strong>'+body(c)+':</strong> يعتمد السياسة ويشرف على تطبيقها ويطلع على تقرير الامتثال '+(L?"ربع سنوياً":"مرتين في السنة على الأقل")+'.</li><li><strong>الإدارة التنفيذية:</strong> توفر الموارد وتضمن أن لكل التزام مالكاً.</li><li><strong>مسؤول الامتثال (أو من يقوم مقامه):</strong> يحدّث سجل الالتزامات، ويتابع المراجعات، ويرفع التقارير، ويقدم المشورة في المتطلبات الجديدة.</li><li><strong>ملاك الالتزامات:</strong> يطبقون المتطلب في إدارتهم ويحتفظون بدليل التطبيق.</li><li><strong>جميع العاملين:</strong> يلتزمون بالسياسة ويبلغون عن أي مخالفة.</li></ol>'+
  '<h2>3. سجل الالتزامات</h2><ol><li>يُحفظ سجل موحد للمتطلبات النظامية والتعاقدية والقطاعية، يبين المصدر والنوع (إجباري أو اختياري) والمالك والحالة.</li><li>يُضاف كل متطلب جديد أو معدّل إلى السجل خلال (....) يوم عمل من صدوره أو العلم به.</li><li>تُصنف الحالة: ملتزم، جزئي، غير ملتزم، غير مقيّم.</li></ol>'+
  '<h2>4. المراقبة والمراجعة</h2><ol><li>لكل التزام دورية مراجعة (شهرية، ربع سنوية، نصف سنوية، سنوية) بحسب أهميته ومخاطره.</li><li>يحتفظ المالك بدليل يثبت الالتزام، ولا يُعد الالتزام متحققاً بلا دليل.</li><li>يُسجل تاريخ كل مراجعة والموعد القادم.</li></ol>'+
  '<h2>5. معالجة عدم الامتثال</h2><ol><li>يُسجَّل كل عدم امتثال وجزئي مع إجراء تصحيحي ومسؤول وموعد.</li><li>يُرفع عدم الامتثال في التزام إلزامي إلى '+body(c)+' دون تأخير.</li><li>تُتابع الإجراءات التصحيحية في خطة التنفيذ حتى إغلاقها.</li></ol>'+
  '<h2>6. الإبلاغ عن المخالفات</h2><p>يُبلَّغ عن أي مخالفة وفق سياسة الإبلاغ عن المخالفات، ولا يتعرض المبلّغ بحسن نية لأي إجراء انتقامي.</p>'+
  '<h2>7. التوعية والتدريب</h2><p>يُعرَّف العاملون بالمتطلبات التي تخص أعمالهم عند التعيين وسنوياً، وتُوثق مشاركتهم.</p>'+
  '<h2>8. التقارير</h2><p>يُعد مسؤول الامتثال تقرير الامتثال متضمناً نسبة الامتثال والاستثناءات والمراجعات المتأخرة والإجراءات التصحيحية، ويرفعه إلى '+body(c)+'.</p>'+
  '<h2>9. المراجعة والاعتماد</h2><p>تُراجع هذه السياسة سنوياً أو عند أي تغير جوهري في الأنظمة، وتسري من تاريخ اعتمادها.</p>'}},
family:{t:"هيكل الميثاق العائلي",d:"أبواب الميثاق ومسائله. للشركات العائلية.",fam:1,f:function(c){
  return '<p>يجيز نظام الشركات للمؤسسين أو الشركاء أو المساهمين إبرام ميثاق عائلي يكون ملزماً، بشرط ألا يتعارض مع النظام ولا مع عقد التأسيس أو النظام الأساس. هذا هيكل للأبواب والمسائل التي تحسمها العائلة المالكة ل'+esc(co(c.name))+'، وليس نصاً نهائياً.</p>'+
  '<h2>1. القيم والرؤية</h2><ul><li>قيم العائلة ورؤيتها للشركة.</li><li>تعريف أفراد العائلة المشمولين بالميثاق.</li></ul><h2>2. الملكية</h2><ul><li>من يحق له التملك، وقواعد دخول الأصهار والأحفاد.</li><li>التصرف في الحصص أو الأسهم وحق الأولوية وطريقة التقييم عند التخارج.</li><li>سياسة توزيع الأرباح ونسبة ما يُحتجز للنمو.</li></ul>'+
  '<h2>3. حوكمة العائلة</h2><ul><li>مجلس العائلة: تكوينه واجتماعاته وقراراته.</li><li>علاقة مجلس العائلة ب'+body(c)+'، وما يختص به كل منهما.</li></ul><h2>4. العمل في الشركة</h2><ul><li>شروط توظيف أفراد العائلة: المؤهل والخبرة الخارجية والمسار الوظيفي.</li><li>الأجور والتقييم على أساس الوظيفة لا القرابة.</li><li>الفصل بين صفة المالك وصفة الموظف.</li></ul>'+
  '<h2>5. التعاقب</h2><ul><li>معايير اختيار القيادات وخطة إعداد الجيل التالي.</li><li>ترتيبات الطوارئ عند غياب القائد.</li></ul><h2>6. تسوية الخلافات</h2><ul><li>مراحل التسوية: الحوار، ثم الوساطة، ثم التحكيم.</li><li>الجهة التي يُحتكم إليها.</li></ul><h2>7. أحكام ختامية</h2><ul><li>آلية تعديل الميثاق والأغلبية المطلوبة.</li><li>توقيع أفراد العائلة وانضمام من يبلغ سن الرشد.</li></ul>'}}
