<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>تمام برو | تسجيل الدخول</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
:root{--bg:#F1F4F2;--surface:#fff;--ink:#13231E;--muted:#56675F;--line:#D5DEDA;--brand:#0D6B56;--bad:#AE2E25;--bad-soft:#F8E2DF}
@media (prefers-color-scheme:dark){:root{--bg:#0E1815;--surface:#16231F;--ink:#EDF4F1;--muted:#A3BCB3;--line:#24554A;--brand:#2FB391;--bad:#F2988F;--bad-soft:#3A1E1B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
main{width:min(400px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{margin:0 0 4px;font:600 22px "Readex Pro","IBM Plex Sans Arabic",sans-serif}
p{margin:0 0 20px;color:var(--muted)}
label{display:block;margin:12px 0 4px;font-weight:500}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand img{width:32px;height:32px}
.brand h1{margin:0}
button:disabled{opacity:.6;cursor:wait}
#err{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:none}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/favicon.svg" alt=""><h1>تمام برو</h1></div>
  <p id="sub">سجّل الدخول للمتابعة</p>
  <form id="f" autocomplete="on">
    <div id="nameRow" hidden><label for="name">الاسم الكامل</label><input id="name" autocomplete="name"></div>
    <label for="u">اسم المستخدم</label><input id="u" autocomplete="username" dir="ltr" required>
    <label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" dir="ltr" required>
    <button id="go" type="submit">دخول</button>
  </form>
  <div id="err" role="alert"></div>
</main>
<script src="/login.js"></script>
</body>
</html>
