/* ---------- cafés: copy between cafés and comparison ---------- */
const pxOf=cid=>cid==='default'?'':'cafes/'+cid+'/';
async function loadCafe(cid,withSales){const px=pxOf(cid),db=S.db,g=async c=>(await db.collection(px+c).limit(1000).get()).docs.map(d=>({id:d.id,...d.data()}));
  const r={materials:await g('materials'),products:(await g('products')).map(norm)};if(withSales){r.sales=await g('sales');const c=await db.doc(px+'config/main').get();r.cfg={...DEF,...(c.exists?c.data():{})}}return r}
async function copyFrom(src,doM,doR){const d=await loadCafe(src),key=x=>(x.name||x.nameEn||'').trim().toLowerCase(),map={},mIx={},pIx={};let nm_=0,np=0;
  S.materials.forEach(m=>mIx[key(m)]=m.id);S.products.forEach(p=>pIx[(p.type==='prep'?'p|':'x|')+key(p)]=p.id);
  const need=new Set();if(doR)d.products.forEach(p=>p.lines.forEach(l=>need.add(l.m)));
  for(const m of d.materials){if(!doM&&!need.has(m.id))continue;const tid=mIx[key(m)],clash=!tid&&byId(S.materials,m.id);map[m.id]=tid||(clash?newId():m.id);if(tid&&!doM)continue;const{id,...data}=m;if(!await save('materials',map[m.id],{...data,example:false}))return null;nm_++}
  if(doR){const ps=d.products.slice().sort((a,b)=>(a.type==='prep'?0:1)-(b.type==='prep'?0:1));ps.forEach(p=>{const tid=pIx[(p.type==='prep'?'p|':'x|')+key(p)],clash=!tid&&byId(S.products,p.id);map[p.id]=tid||(clash?newId():p.id)});
    for(const p of ps){const{id,...data}=p;if(!await save('products',map[p.id],{...data,example:false,lines:p.lines.map(l=>({...l,m:map[l.m]||l.m}))}))return null;np++}}
  return[nm_,np]}
async function compare(){const out=[],bak={m:S.materials,p:S.products,c:S.cfg};
  for(const c of sorted(S.cafes)){if(c.pin&&!S.unlocked.has(c.id)){out.push({c,locked:true});continue}
    try{const d=await loadCafe(c.id,true);S.materials=d.materials;S.products=d.products;S.cfg=d.cfg;const rs=[];prods().forEach(p=>p.sizes.forEach((z,j)=>{const r=stats(p,j).ratio;if(isFinite(r))rs.push(r)}));
      const last=d.sales.map(x=>x.id).sort().pop(),q=last?(d.sales.find(x=>x.id===last).qty||{}):{};let tq=0,tg=0;prods().forEach(p=>p.sizes.forEach((z,j)=>{const n=num(q[p.id+'|'+j]);tq+=n;tg+=n*stats(p,j).gp}));
      out.push({c,nm:d.materials.length,np:prods().length,avg:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:NaN,above:rs.filter(r=>r>S.cfg.target).length,last:last||'—',tq,tg})}catch(e){out.push({c,locked:true})}
    finally{S.materials=bak.m;S.products=bak.p;S.cfg=bak.c}}
  return out}

async function hashPin(cid,pin){const txt=cid+':'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return'x'+h}}
function gate(){const g=S.gate,c=g.sel&&byId(S.cafes,g.sel);
  return`<div class="card"><h2>${t('gPick')}</h2>${S.cafes.length?`<div class="cafes">${sorted(S.cafes).map(x=>`<button class="cafe" data-act="pick" data-id="${esc(x.id)}" ${g.sel===x.id?'aria-current="true"':''}><b>${esc(nm(x)||t('gUnnamed'))}</b><span>${x.pin?t('gLocked'):t('gOpen')}</span></button>`).join('')}</div>`:`<p class="empty">${t('gNone')}</p>`}
    ${c?`<form class="bar keepf" data-form="pin"><label class="f" for="pin-in">${t('gPin')}: ${esc(nm(c))}<input id="pin-in" type="password" autocomplete="off" required></label><button class="btn primary">${t('gEnter')}</button></form>`:''}</div>
  <form class="card" data-form="newcafe"><h2>${t('gNew')}</h2><div class="grid">${inp('g-name',t('cafeAr'),'')}${inp('g-nameEn',t('cafeEn'),'','text','dir="ltr"')}${inp('g-pin',t('gNewPinL'),'','password','autocomplete="off"')}</div><p class="sub">${t('gPinHint')}</p><div class="row"><button class="btn primary">${t('gCreate')}</button></div></form>
  ${S.cafes.length>1?`<div class="card"><div class="row sp"><h2>${t('cmpT')}</h2><button class="btn" data-act="cmp">${t('cmpGo')}</button></div><p class="sub">${t('cmpHint')}</p>
    ${S.cmp?tbl([[t('cafeL')],[t('nMat'),'n'],[t('nProd'),'n'],[t('avgRatio'),'n'],[t('above'),'n'],[t('lastMonth')],[t('totalQty'),'n'],[t('totalGp'),'n']],S.cmp.map(r=>r.locked?`<tr><td>${esc(nm(r.c))}</td><td colspan="7" class="sz">${t('cmpLocked')}</td></tr>`:`<tr><td>${esc(nm(r.c))}</td><td class="n">${r.nm}</td><td class="n">${r.np}</td><td class="n">${pct(r.avg)}</td><td class="n">${r.above}</td><td dir="ltr" style="text-align:start">${esc(r.last)}</td><td class="n">${fmt(r.tq,0)}</td><td class="n">${fmt(r.tg,0)}</td></tr>`),''):''}</div>`:''}`}
function leaveSubs(){subs.forEach(u=>{try{u()}catch(e){}});subs=[]}
function enter(cid){leaveSubs();Object.assign(S,{cafe:cid,cfg:{...DEF},materials:[],products:[],sales:{},log:[],trash:[],offers:[],od:null,chd:null,dirty:false,pending:null,ready:false,draft:null,edit:null,sq:null,imp:null,rest:null,msup:[],msel:0,sel:new Set()});S.gate.sel=null;try{sessionStorage.setItem('cafe',cid)}catch(e){}
  const loaded=new Set(),done=k=>{loaded.add(k);if(loaded.size===3)S.ready=true;schedule()},onErr=()=>{S.ready=true;schedule()};let pruned=false;
  subs.push(C('materials').limit(1000).onSnapshot(s=>{S.materials=s.docs.map(d=>({id:d.id,...d.data()}));done('m')},onErr),
    C('products').limit(1000).onSnapshot(s=>{S.products=s.docs.map(d=>norm({id:d.id,...d.data()}));done('p')},onErr),
    S.db.doc(PX()+'config/main').onSnapshot(s=>{S.cfg={...DEF,...(s.exists?s.data():{})};done('cfg')},onErr),
    C('sales').limit(120).onSnapshot(s=>{S.sales={};s.docs.forEach(d=>S.sales[d.id]=d.data());schedule()},()=>{}),
    C('offers').limit(500).onSnapshot(s=>{S.offers=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{}),
    C('trash').orderBy('t','desc').limit(100).onSnapshot(s=>{S.trash=s.docs.map(d=>({tid:d.id,...d.data()}));if(view==='log')schedule()},()=>{}),
    C('log').orderBy('t','desc').limit(300).onSnapshot(s=>{S.log=s.docs.map(d=>d.data());if(view==='log')schedule();if(s.size>=300&&!pruned){pruned=true;const col=C('log');s.docs.slice(-60).forEach(d=>col.doc(d.id).delete().catch(()=>{}))}},()=>{}));
  if(S.entered){view='home';sub=''}S.entered=true;skipKeep=true;render()}
function leave(){leaveSubs();sub='';S.dirty=false;S.cafe=null;S.left=true;S.ready=false;S.gate.sel=null;try{sessionStorage.removeItem('cafe')}catch(e){}skipKeep=true;render()}
async function delCafe(){const cid=S.cafe,db=S.db;try{for(const c of ['materials','products','offers','sales','log','trash']){const col=C(c),sn=await col.limit(1000).get();for(const d of sn.docs)await col.doc(d.id).delete()}
    await db.doc(PX()+'config/main').delete();await db.collection('cafes').doc(cid).delete()}catch(e){return fail(e)}leave();toast(t('deleted'))}

  $('notice').innerHTML=gated?'':(S.pending?`<div class="note warn row sp"><span>${t('dirtyMsg')}</span><span class="row"><button type="button" class="btn danger" id="g-go">${t('dirtyGo')}</button><button type="button" class="btn" id="g-stay">${t('dirtyStay')}</button></span></div>`:'')+(S.offline?`<div class="note warn">${t('offline')}</div>`:'')+(anyEx?`<div class="note">${t('exBanner')}</div>`:'');
  if(S.pending&&!gated){$('g-go').onclick=()=>{const f=S.pending;S.pending=null;S.dirty=false;f()};$('g-stay').onclick=()=>{S.pending=null;render()}}
  root.innerHTML=gated?(S.regReady?gate():wait):S.ready?V[view]():wait;
  for(const id in keep){const el=$(id);if(el)el.value=keep[id]}
  edTotals();odTotals();hdPreview();

function go(v){view=v;sub='';S.dirty=false;S.chd=null;S.od=null;S.draft=null;S.edit=null;S.msup=[];S.msel=0;S.sq=null;S.sx=null;S.sa=null;S.rest=null;skipKeep=true;try{history.replaceState(null,'','#'+v)}catch(e){}render()}

    if(a==='trest'){if(!await save(x.coll,x.oid,x.data))return;logAct('lAdd',x.coll==='offers'?'kOffer':x.coll==='materials'?'kMaterial':x.type==='prep'?'kPrep':'kProduct',x.name)}
    if(S.db){try{await C('trash').doc(id).delete()}catch(e){}}else S.trash=S.trash.filter(z=>z.tid!==id);toast(t(a==='trest'?'restored':'deleted'));return render()}
  if(a==='simadd'){S.sim.ov.push({m:'',price:''});return render()}
  if(a==='simrm'){S.sim.ov.splice(+id,1);return render()}
  if(a==='simapply'){const rows=simData().filter(r=>r.apply);if(!rows.length)return toast(t('simNone'));if(!b.dataset.armed){b.dataset.armed=1;b.dataset.label=b.textContent;b.textContent=t('confirm')+' ('+rows.length+')';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},5000);return}
    b.disabled=true;const by=new Map();rows.forEach(r=>{if(!by.has(r.p.id))by.set(r.p.id,{p:r.p,m:{}});by.get(r.p.id).m[r.j]=r.np});
    for(const{p,m}of by.values()){const{id:pid,...data}=p;if(!await save('products',pid,{...data,sizes:p.sizes.map((z,j)=>j in m?{...z,price:+m[j].toFixed(2)}:z)}))return render()}
    logAct('lEdit','kProduct',t('sim')+': '+rows.length);toast(t('simDone')+': '+rows.length);return render()}
  if(a==='odnew'){S.od={id:newId(),isNew:true,name:'',nameEn:'',price:'',items:[{k:'',qty:1}]};skipKeep=true;return render()}
  if(a==='odedit'){const x=byId(S.offers,id);S.od={...x,items:(x.items||[]).map(i=>({...i}))};skipKeep=true;render();return window.scrollTo({top:0})}
  if(a==='odadd'){S.od.items.push({k:'',qty:1});return render()}
  if(a==='odrm'){S.od.items.splice(+id,1);S.dirty=true;return render()}
  if(a==='odsave'){const o=S.od,items=o.items.filter(i=>psOf(i.k)&&num(i.qty)>0).map(i=>({k:i.k,qty:num(i.qty)}));if(!(o.name.trim()||o.nameEn.trim()))return toast(t('needName'));if(!items.length||!(num(o.price)>0))return toast(t('needItems'));
    if(await save('offers',o.id,{name:o.name.trim(),nameEn:o.nameEn.trim(),price:num(o.price),items})){logAct(o.isNew?'lAdd':'lEdit','kOffer',o.name||o.nameEn);S.od=null;S.dirty=false;toast(t('saved'));render()}return}
  if(a==='chadd'){if(!S.chd)S.chd=curCh().map(c=>({...c}));S.chd.push({name:'',nameEn:'',comm:'',up:''});S.dirty=true;return render()}
  if(a==='chrm'){if(!S.chd)S.chd=curCh().map(c=>({...c}));S.chd.splice(+id,1);S.dirty=true;return render()}
  if(a==='chsave'){const ch=curCh().filter(c=>(c.name||c.nameEn||'').trim()).map(c=>({name:(c.name||'').trim(),nameEn:(c.nameEn||'').trim(),comm:num(c.comm),up:num(c.up)}));if(await saveCfg({channels:ch})){S.chd=null;S.dirty=false;logAct('lEdit','kSettings',t('chan'));toast(t('saved'));setSub('')}return}
  if(a==='cmp'){b.disabled=true;S.cmp=await compare();return render()}
  if(a==='copycafe'){const src=byId(S.cafes,$('cp-src').value),doM=$('cp-m').checked,doR=$('cp-r').checked;if(!src||!(doM||doR))return toast(t('needSrc'));
    if(src.pin&&!S.unlocked.has(src.id)){if(await hashPin(src.id,$('cp-pin').value)!==src.pin)return toast(t('gBad'));S.unlocked.add(src.id)}
    b.disabled=true;toast(t('exporting'));let r=null;try{r=await copyFrom(src.id,doM,doR)}catch(e){fail(e)}if(r){logAct('lImport','kData',nm(src)+': '+r[0]+' + '+r[1]);toast(t('copied')+': '+r[0]+' + '+r[1])}return render()}
  if(a==='pick'){const c=byId(S.cafes,id);if(!c)return;if(c.pin){S.gate.sel=id;render();const p=$('pin-in');if(p)p.focus()}else enter(id);return}
  if(a==='delcafe'){if(!b.dataset.armed){b.dataset.armed=1;b.dataset.label=b.textContent;b.textContent=t('confirmDel');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},4000);return}b.disabled=true;return delCafe()}
  if(a==='pdf'||a==='xls')return doExport(b,a==='pdf'?'pdf':'xlsx',b.dataset.rep,id);
  if(a==='dldata')return offer(b,'cafe-data '+today()+'.xlsx',dataFile);
  if(a==='fxp')return offer(b,'foodics-products '+today()+'.csv',async()=>fxProducts());if(a==='fxi')return offer(b,'foodics-inventory-items '+today()+'.csv',async()=>fxItems());if(a==='fxg')return offer(b,'foodics-ingredients-reference '+today()+'.csv',async()=>fxIng());
  if(a==='del'||a==='wipe'){if(a==='del'&&usedIn(id))return toast(t('inUse'));
    if(!b.dataset.armed){b.dataset.armed=1;b.dataset.label=b.textContent;b.textContent=t('confirmDel');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},4000);return}
    if(a==='del'){const x=byId(S[c],id);if(x){const{id:_i,...data}=x,tr={coll:c,oid:id,t:new Date().toISOString(),name:x.name||x.nameEn||'',type:x.type||'',data};if(S.db){try{await C('trash').doc(newId()).set(tr)}catch(e){}}else S.trash.unshift({tid:newId(),...tr})}if(await del(c,id)){S.sel.delete(id);logAct('lDel',c==='offers'?'kOffer':c==='materials'?'kMaterial':x&&x.type==='prep'?'kPrep':'kProduct',x?x.name||x.nameEn:'');toast(t('deleted'));render()}}
    else{b.disabled=true;for(const col of ['products','materials'])for(const x of S[col].filter(x=>x.example))await del(col,x.id);toast(t('wiped'));render()}}
  else if(a==='edit'||a==='dup'){S.draft=toDraft(byId(S.products,id),a==='dup');skipKeep=true;render();window.scrollTo({top:0})}
  else if(a==='editmat'){S.edit=mat(id);S.msup=(S.edit.suppliers||[]).map(x=>({...x}));S.msel=num(S.edit.sup);setSub('form')}
  else if(a==='newmat'){S.edit=null;S.msup=[];S.msel=0;setSub('form')}
  else if(a==='sub')setSub(id);
  else if(a==='back')back();
  else if(a==='cancel')back();
  else if(a==='addsup'){if(!S.msup.length&&$('m-price')&&(num($('m-price').value)>0))S.msup.push({name:'',buyUnit:$('m-buyUnit').value,price:$('m-price').value,packSize:$('m-packSize').value});S.msup.push({name:'',buyUnit:'',price:'',packSize:''});render()}
  else if(a==='rmsup'){S.msup.splice(+id,1);if(S.msel>=S.msup.length)S.msel=0;if(!S.msup.length&&S.edit)skipKeep=false;render()}
  else if(a==='savesales'){const q={};for(const k in curQty())if(num(curQty()[k])>0)q[k]=num(curQty()[k]);const ex={};for(const k in EXP)if(num(curExp()[k])>0)ex[k]=num(curExp()[k]);if(await saveSales(S.month,q,ex,curAlloc())){S.sq=null;S.sx=null;S.sa=null;logAct('lEdit','kSales',S.month);S.dirty=false;toast(t('saved'));setSub('')}}
  else if(a==='dlbackup')return offer(b,'cafe-backup '+today()+'.json',async()=>JSON.stringify({app:'cafe-ledger',v:1,date:new Date().toISOString(),cfg:S.cfg,materials:S.materials,products:S.products,offers:S.offers,sales:S.sales}));
  else if(a==='restno'){S.rest=null;render()}
  else if(a==='restgo'){b.disabled=true;const r=S.rest;for(const col of [...COLLS,'offers']){const ids=new Set(r[col].map(x=>x.id));for(const x of S[col].slice())if(!ids.has(x.id))await del(col,x.id);for(const x of r[col]){const{id,...data}=x;if(!await save(col,id,data))return render()}}
    for(const mo of Object.keys(S.sales))if(!r.sales[mo]){if(S.db){try{await C('sales').doc(mo).delete()}catch(e){}}else delete S.sales[mo]}for(const mo in r.sales)await saveSales(mo,r.sales[mo].qty||{},r.sales[mo].exp,r.sales[mo].alloc);
    await saveCfg(r.cfg||{});S.rest=null;logAct('lRestore','kData',(r.date||'').slice(0,10));toast(t('restDone'));render()}
  else if(a==='rmlogo'){if(await saveCfg({logo:''})){toast(t('saved'));render()}}
  else if(a==='newprod'||a==='newprep'){S.draft={id:newId(),isNew:true,type:a==='newprep'?'prep':'product',name:'',nameEn:'',cat:'ساخن',method:'',prepMin:'',allergens:[],img:'',yieldQty:'',yieldUnit:'مل',sizes:[{name:'',nameEn:'',price:'',sku:'',lines:[{m:'',qty:'',note:''}]}]};render()}
  else if(a==='addsize'){d.sizes.push({name:'',nameEn:'',price:'',sku:'',lines:d.sizes[d.sizes.length-1].lines.map(l=>({...l}))});render()}
  else if(a==='rmsize'){d.sizes.splice(+id,1);render()}
  else if(a==='addline'){d.sizes[+id].lines.push({m:'',qty:'',note:''});render()}
  else if(a==='rmline'){const[j,i]=id.split(':');d.sizes[+j].lines.splice(+i,1);render()}
  else if(a==='closeprod'){S.draft=null;S.dirty=false;render();window.scrollTo({top:0})}
  else if(a==='rmpimg'){d.img='';render()}
  else if(a==='saveprod'){if(!(d.name.trim()||d.nameEn.trim()))return toast(t('needName'));const isP=d.type==='prep';if(isP&&!(num(d.yieldQty)>0))return toast(t('needYield'));
    const mp=new Map();d.sizes.forEach((z,j)=>z.lines.forEach(l=>{if(!l.m||!(num(l.qty)>0))return;const k=l.m+'|'+(l.note||'').trim();let o=mp.get(k);if(!o){o={m:l.m,note:(l.note||'').trim(),qtys:d.sizes.map(()=>0)};mp.set(k,o)}o.qtys[j]+=num(l.qty)}));const lines=[...mp.values()];
    const data={type:d.type,name:d.name.trim(),nameEn:d.nameEn.trim(),cat:d.cat,method:d.method||'',sizes:d.sizes.map(s=>({name:(s.name||'').trim(),nameEn:(s.nameEn||'').trim(),price:num(s.price),sku:(s.sku||'').trim(),cal:num(s.cal)})),lines,prepMin:num(d.prepMin),allergens:d.allergens||[],img:d.img||'',example:!!d.example};
    if(isP){data.yieldQty=num(d.yieldQty);data.yieldUnit=d.yieldUnit}
    if(await save('products',d.id,data)){logAct(d.isNew?'lAdd':'lEdit',isP?'kPrep':'kProduct',data.name||data.nameEn);S.draft=null;S.dirty=false;toast(t('saved'));render();window.scrollTo({top:0})}}
  else if(a==='impno'){S.imp=null;render()}
  else if(a==='impgo'){b.disabled=true;const r=S.imp;for(const m of r.mats)if(!await save('materials',m.id,m.data))return render();for(const p of r.prods)if(!await save('products',p.id,p.data))return render();logAct('lImport','kData',r.mats.length+' + '+r.prods.length);S.imp=null;toast(t('impDone'));render()}});

/* ---------- boot ---------- */
S.month=today().slice(0,7);
render();
(async()=>{const use=n=>{try{return window.claude&&window.claude.use?window.claude.use(n):null}catch(e){return null}};
  Promise.resolve(use('downloads')).then(d=>{S.dl=d||null}).catch(()=>{});
  let db=null;try{db=await use('db')}catch(e){}
  if(!db){S.offline=true;S.ready=true;render();return}
  S.db=db;let made=false;
  db.collection('cafes').limit(300).onSnapshot(async sn=>{S.cafes=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.cafes.length&&!made){made=true;let c={};try{const g=await db.doc('config/main').get();if(g.exists)c=g.data()}catch(e){}
      try{await db.collection('cafes').doc('default').set({name:c.name||L.ar.gMain,nameEn:c.nameEn||L.en.gMain,pin:'',created:new Date().toISOString()})}catch(e){}return}
    const first=!S.regReady;S.regReady=true;
    if(first&&!S.cafe){let sc='';try{sc=sessionStorage.getItem('cafe')||''}catch(e){}
      if(sc&&byId(S.cafes,sc))return enter(sc);if(S.cafes.length===1&&!S.cafes[0].pin&&!S.left)return enter(S.cafes[0].id)}
    if(S.cafe&&!byId(S.cafes,S.cafe)&&S.ready)return leave();
    schedule()},()=>{S.offline=true;S.db=null;S.ready=true;schedule()});
  try{const user=await use('user');if(user&&user.can&&(await user.can('data.write'))===false)document.body.classList.add('ro')}catch(e){}
})();
</script>
