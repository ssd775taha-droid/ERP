# نشر مجاني على Render: Dashboard > New > Blueprint > اختر المستودع، ثم في "Blueprint Path" اكتب render.free.yaml.
# تنبيه: قاعدة بيانات Render المجانية تُحذف تلقائياً بعد 30 يوماً، والخدمة بلا قرص دائم فتضيع نسخ الاحتياط المحلية
# عند كل إعادة نشر أو إعادة تشغيل، والخدمة تنام بعد 15 دقيقة بلا استخدام.
databases:
  - name: tamam-pro-db
    plan: free
services:
  - type: web
    name: tamam-pro
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tamam-pro-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
