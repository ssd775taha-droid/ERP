<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ERP — المالك</title>
<meta name="theme-color" content="#1d5c57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERP مالك">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="login">
  <div class="box">
    <h1>تطبيق المالك</h1>
    <p>سجّل دخولك ببيانات نظام ERP نفسها</p>
    <form id="lf">
      <label>اسم المستخدم<input id="lu" autocomplete="username" required></label>
      <label>كلمة السر<input id="lp" type="password" autocomplete="current-password" required></label>
      <button type="submit">دخول</button>
    </form>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <b>نظام ERP</b>
    <span class="who" id="who"></span>
    <button id="logout">خروج</button>
  </header>
  <main>
    <section class="page" id="pg-today"></section>
    <section class="page" id="pg-pending"></section>
    <section class="page" id="pg-reports"></section>
  </main>
  <nav class="tabs">
    <button data-t="today">اليوم</button>
    <button data-t="pending">المعتمدات <span class="badge" id="pend-badge" hidden>0</span></button>
    <button data-t="reports">التقارير</button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
